    function refreshKnowledge(){const list=document.getElementById('knowledgeList');if(list)list.innerHTML=knowledgeHtml();wireKnowledgeButtons()}
    async function syncKnowledge(action,payload={}){const token=roseAccountToken();if(!token)return null;const r=await fetch('https://wildrose-widget.wildeautomations.com/api/rose-account-knowledge',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Knowledge sync failed');return j}
    function applyConfigObject(cfg){if(!cfg)return;const a=cfg.appearance||{};state.name=a.assistantName||state.name;state.description=a.greetingMessage||state.description;state.accent=a.brandPrimary||state.accent;state.secondary=a.brandAccent||state.secondary;state.background=a.backgroundColor||state.background;state.text=a.textColor||state.text;state.bubble=a.bubbleColor||state.bubble;state.button=a.buttonColor||state.button;state.logoUrl=a.avatarUrl||state.logoUrl;state.logoPrompt=a.logoPrompt||state.logoPrompt;if(cfg.settings)Object.assign(settings,cfg.settings);if(Array.isArray(cfg.context)){settings.knowledge=cfg.context;saveKnowledge()}if(Array.isArray(cfg.connections)){connectionQueue.splice(0,connectionQueue.length,...cfg.connections.filter(c=>c.provider!=='context').map(c=>c.provider));flagged.splice(0,flagged.length,...cfg.connections.filter(c=>c.provider==='context').map(c=>c.label))}applyPreview();saveDraftLocal()}
    async function hydrateRoseAccount(){const token=roseAccountToken();if(!token)return;try{const r=await fetch('https://wildrose-widget.wildeautomations.com/api/rose-account-dashboard',{headers:{'Authorization':`Bearer ${token}`}});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||'Account sync failed');settings.businessName=j.customer?.businessName||settings.businessName;settings.website=j.customer?.website||settings.website;settings.ownerEmail=j.account?.email||settings.ownerEmail;localStorage.setItem('roseClientSettings',JSON.stringify({businessName:settings.businessName,website:settings.website,ownerEmail:settings.ownerEmail,ownerName:settings.ownerName,backupEmail:settings.backupEmail,phone:settings.phone}));if(j.draft||j.published){applyConfigObject(j.draft||j.published);lastDraftSavedAt=j.draft?.updatedAt||'';draftChip.textContent=j.draft?'Draft saved':'Published'}const k=await fetch('https://wildrose-widget.wildeautomations.com/api/rose-account-knowledge',{headers:{'Authorization':`Bearer ${token}`}}).then(x=>x.json()).catch(()=>null);if(k?.notes&&!j.draft){settings.knowledge=k.notes;saveKnowledge()}if(document.querySelector('.settings-page')){showSection('Settings')}refreshEmptyPrompt();notify('Account connected')}catch(err){console.error(err);notify('Account sync failed')}}
    function wireKnowledgeButtons(){document.querySelectorAll('[data-delete-knowledge]').forEach(btn=>btn.onclick=async()=>{const note=settings.knowledge.find(x=>x.id===btn.dataset.deleteKnowledge);if(note){note.revokedAt=new Date().toISOString();saveKnowledge();refreshKnowledge();notify('Knowledge removed');syncKnowledge('delete',{noteId:note.id}).catch(()=>{})}})}
    function saveApiKeys(){localStorage.setItem('rosePreviewApiKeys',JSON.stringify(settings.apiKeys))}
    async function syncApiKeys(action,payload={}){const token=roseAccountToken();if(!token)return null;const r=await fetch('https://wildrose-widget.wildeautomations.com/api/rose-account-api-keys',{method:action==='list'?'GET':'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:action==='list'?undefined:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||'API key sync failed');return j}
    function apiKeysHtml(){const active=settings.apiKeys.filter(k=>!k.revokedAt);return active.length?active.map(k=>`<div class="key-row"><div class="key-meta"><b>${k.name}</b><span>${k.prefix}…${k.last4} · created ${new Date(k.createdAt).toLocaleDateString()}</span></div><div class="key-actions"><button class="danger" type="button" data-revoke-key="${k.id}">Revoke</button></div></div>`).join(''):'<small>No API keys yet.</small>'}
    function makeApiSecret(){const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);return 'wr_'+Array.from(bytes,b=>b.toString(36).padStart(2,'0')).join('').slice(0,38)}
    function wireApiKeyButtons(){document.querySelectorAll('[data-revoke-key]').forEach(btn=>btn.onclick=async()=>{const k=settings.apiKeys.find(x=>x.id===btn.dataset.revokeKey);if(k){k.revokedAt=new Date().toISOString();saveApiKeys();refreshApiKeys();notify('API key revoked');syncApiKeys('revoke',{keyId:k.id}).catch(()=>{})}})}
    function refreshApiKeys(){const list=document.getElementById('apiKeyList');if(list)list.innerHTML=apiKeysHtml();wireApiKeyButtons()}
    function toggleHtml(key,label){return `<div class="toggle-row"><span>${label}</span><button class="toggle ${settings[key]?'on':''}" type="button" data-toggle="${key}" aria-label="${label}"></button></div>`}
    function statusPills(){return [`Email ${settings.email?'on':'off'}`,`SMS ${settings.sms?'on':'off'}`,`CRM ${settings.crmEnabled?settings.crm:'off'}`,`Calendar ${settings.calendar?'on':'off'}`,`Tests ${settings.requireTests?'required':'optional'}`].map((t,i)=>`<span class="pill ${/on|HubSpot|Pipedrive|Salesforce|Airtable|Sheets|required/.test(t)?'on':''}">${t}</span>`).join('')}
    function wirePage(){document.querySelector('.fb-search')?.addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.fb-panel').forEach(panel=>panel.style.display=!q||panel.innerText.toLowerCase().includes(q)?'':'none')});document.querySelectorAll('[data-scroll-settings]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-scroll-settings]').forEach(x=>x.classList.toggle('active',x===btn));document.getElementById('settings-'+btn.dataset.scrollSettings)?.scrollIntoView({behavior:'smooth',block:'start'})}));document.querySelectorAll('[data-connect-tool]').forEach(btn=>{const meta=toolMeta(btn.dataset.connectTool);if(isConnected(meta.slug)){btn.disabled=true;btn.textContent='Connected'}btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(isConnected(meta.slug))return;startComposioConnect(meta,btn)})});document.querySelectorAll('[data-command]:not([data-connect-tool])').forEach(btn=>btn.addEventListener('click',()=>{showSection('Appearance');input.value=btn.dataset.command;input.focus();modeText.textContent='Ready'}));document.querySelectorAll('[data-toggle]').forEach(btn=>btn.addEventListener('click',()=>{const key=btn.dataset.toggle;settings[key]=!settings[key];btn.classList.toggle('on',settings[key]);const status=document.getElementById('settingsStatus');if(status)status.innerHTML=statusPills();notify(`${btn.previousElementSibling.textContent} ${settings[key]?'on':'off'}`);scheduleDraftSave()}));document.querySelectorAll('[data-filter-tab]').forEach(btn=>btn.addEventListener('click',()=>{const f=btn.dataset.filterTab;document.querySelectorAll('[data-filter-tab]').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.sug-card').forEach(card=>card.classList.toggle('hidden',f!=='All'&&card.dataset.filter!==f));notify(f==='All'?'Showing all suggestions':`Showing ${f}`)}));document.getElementById('saveSettings')?.addEventListener('click',()=>{settings.businessName=document.getElementById('businessName').value.trim();settings.website=document.getElementById('website').value.trim();settings.ownerName=document.getElementById('ownerName').value.trim();settings.ownerEmail=document.getElementById('ownerEmail').value.trim();settings.backupEmail=document.getElementById('backupEmail').value.trim();settings.phone=document.getElementById('phone').value.trim();notify('Client info saved');localStorage.setItem('roseClientSettings',JSON.stringify({businessName:settings.businessName,website:settings.website,ownerName:settings.ownerName,ownerEmail:settings.ownerEmail,backupEmail:settings.backupEmail,phone:settings.phone}));scheduleDraftSave()});document.getElementById('addKnowledge')?.addEventListener('click',async()=>{const text=(document.getElementById('knowledgeText')?.value||'').trim();if(!text){notify('Add a note first');return}let note={id:'ctx_'+Date.now().toString(36),text,source:'dashboard',createdAt:new Date().toISOString()};settings.knowledge.unshift(note);saveKnowledge();refreshKnowledge();document.getElementById('knowledgeText').value='';notify('Knowledge added');try{const j=await syncKnowledge('add',{text});if(j?.note){settings.knowledge=settings.knowledge.filter(n=>n.id!==note.id);settings.knowledge.unshift(j.note);saveKnowledge();refreshKnowledge();notify('Knowledge saved to draft');scheduleDraftSave()}}catch(err){notify('Saved in preview')}});wireKnowledgeButtons();document.getElementById('createApiKey')?.addEventListener('click',async()=>{const name=(document.getElementById('apiKeyName')?.value||'Dashboard key').trim()||'Dashboard key';let secret='',key=null;try{const j=await syncApiKeys('create',{name});secret=j.secret;key=j.key;settings.apiKeys=[key,...settings.apiKeys.filter(k=>k.id!==key.id)];notify('API key created')}catch(err){secret=makeApiSecret();key={id:'rak_'+Date.now().toString(36),name,prefix:secret.slice(0,7),last4:secret.slice(-4),createdAt:new Date().toISOString(),localOnly:true};settings.apiKeys.unshift(key);notify('API key created locally')}saveApiKeys();refreshApiKeys();const box=document.getElementById('apiSecretBox');if(box){box.classList.add('show');box.innerHTML=`<b>Copy this key now:</b><code>${secret}</code><button class="ghost" type="button" id="copyApiSecret">Copy key</button>`;document.getElementById('copyApiSecret')?.addEventListener('click',()=>{navigator.clipboard?.writeText(secret);notify('API key copied')})}document.getElementById('apiKeyName').value=''});wireApiKeyButtons();syncApiKeys('list').then(j=>{if(j?.keys){settings.apiKeys=j.keys;saveApiKeys();refreshApiKeys()}}).catch(()=>{})}
    function showSection(name){document.querySelectorAll('.section-tab').forEach(t=>t.classList.toggle('active',t.dataset.section===name));app.classList.toggle('page-mode',name!=='Appearance');messages.innerHTML=name==='Settings'?settingsHtml():emptyPromptHtml();messages.style.justifyContent=name==='Appearance'?'center':'flex-start';wirePage();modeText.textContent=name==='Appearance'?'Draft preview':name;const settingsTop=document.getElementById('settingsTop');if(settingsTop)settingsTop.textContent=name==='Settings'?'Workground':'Settings'}
    document.getElementById('attachDoc')?.addEventListener('click',()=>document.getElementById('docInput')?.click());document.getElementById('docInput')?.addEventListener('change',async e=>{await attachDocuments(e.target.files||[]);e.target.value=''});form.addEventListener('submit',async e=>{e.preventDefault();const value=input.value.trim();if(!value)return;add('user',value);chatHistory.push({role:'user',content:value});saveCommandMemory();input.value='';input.style.height='auto';modeText.textContent='Thinking';const thinking=addThinking();const pause=ms=>new Promise(r=>setTimeout(r,ms));try{const started=performance.now();const reply=await runRoseLlm(value);const elapsed=performance.now()-started;if(elapsed<850)await pause(850-elapsed);finishAssistant(thinking,reply)}catch(err){console.error(err);await pause(650);finishAssistant(thinking,'I could not process that command right now — try again in a moment.')} });input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
    async function publish(){draftChip.textContent='Publishing…';try{await saveDraftNow();const token=roseAccountToken();if(!token)throw new Error('Sign in first');const r=await fetch('https://wildrose-widget.wildeautomations.com/api/rose-account-draft',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({action:'publish',draft:draftSnapshot()})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||'Publish failed');draftChip.textContent='Published';notify(`Published ${state.name}`);add('assistant',`Published to the installed Rose widget. Appearance, context, and draft connections are now live.`)}catch(err){console.error(err);draftChip.textContent='Draft saved';notify(err.message||'Publish failed');add('assistant',`Could not publish yet: ${err.message||'publish failed'}`)}}
    window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='rose-composio-connected'||d.roseComposioConnected){markConnected(toolMeta(d.toolkit||d.tool||d.provider))}});document.querySelectorAll('.section-tab').forEach(tab=>tab.addEventListener('click',()=>showSection(tab.dataset.section)));document.getElementById('settingsTop')?.addEventListener('click',()=>showSection(app.classList.contains('page-mode')?'Appearance':'Settings'));document.getElementById('publishTop').addEventListener('click',publish);window.addEventListener('load',()=>{refreshContextStrip();setTimeout(applyPreview,650);hydrateRoseAccount()});
  </script>
