        if(!usage.available){chip.textContent='Minutes not linked';chip.title='Voice usage is not linked to this Rose account yet.';chip.setAttribute('aria-label',chip.title);window.__roseVoiceUsage={label:'Not linked',detail:'Voice usage is not linked to this account.'};const l=document.getElementById('accountMinutes'),d=document.getElementById('accountMinutesDetail');if(l)l.textContent=window.__roseVoiceUsage.label;if(d)d.textContent=window.__roseVoiceUsage.detail;return}
        const left=Math.max(0,Number(usage.remainingMinutes)||0),used=Math.max(0,Number(usage.usedMinutes)||0),included=Math.max(0,Number(usage.includedMinutes)||0);
        chip.textContent=`${left} min left`;chip.title=`Voice minutes this billing cycle: ${used} of ${included} used. ${left} remaining.`;chip.setAttribute('aria-label',chip.title);const percent=included?Math.min(100,Math.round(used/included*100)):0;window.__roseVoiceUsage={label:`${left} min left`,detail:`${used} of ${included} included minutes used this billing cycle.`,used,included,remaining:left,percent,plan:usage.plan||roseAccountProfile.customer?.plan||'',cycleStart:usage.cycleStart||'',cycleLabel:accountCycleLabel(usage.cycleStart||'')};const l=document.getElementById('accountMinutes'),d=document.getElementById('accountMinutesDetail'),m=document.getElementById('accountMinutesMeter'),plan=document.getElementById('accountPlanName'),cycle=document.getElementById('accountBillingCycle'),bar=m?.parentElement;if(l)l.textContent=window.__roseVoiceUsage.label;if(d)d.textContent=window.__roseVoiceUsage.detail;if(m)m.style.width=percent+'%';if(bar)bar.setAttribute('aria-valuenow',String(percent));if(plan)plan.textContent=window.__roseVoiceUsage.plan||'Plan details unavailable';if(cycle)cycle.textContent=window.__roseVoiceUsage.cycleLabel;renderNotificationCenter();
      }catch(error){chip.textContent='Usage unavailable';chip.title=error.message||'Could not load voice usage.';chip.setAttribute('aria-label',chip.title);window.__roseVoiceUsage={label:'Unavailable',detail:'Could not load minutes for this account.'};const l=document.getElementById('accountMinutes'),d=document.getElementById('accountMinutesDetail');if(l)l.textContent=window.__roseVoiceUsage.label;if(d)d.textContent=window.__roseVoiceUsage.detail}
    }
    const hydrateRoseAccountWithUsage=hydrateRoseAccount;
    hydrateRoseAccount=async function(...args){const connected=await hydrateRoseAccountWithUsage.apply(this,args);if(connected){await refreshRoseVoiceMinutes();await refreshBackendConnections();await loadWorkflowRuns();renderNotificationCenter();maybeOpenFirstRun()}return connected};
    window.addEventListener('focus',()=>{if(accountValidated)refreshRoseVoiceMinutes()});
  </script>
