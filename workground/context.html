<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f0e8">
  <title>Context web · Rose Workground</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#19130f;background:#f6f0e8}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;grid-template-rows:auto 1fr}
    header{display:flex;align-items:center;padding:24px clamp(24px,5vw,72px)}
    .brand{display:inline-flex;align-items:center;gap:12px;color:inherit;text-decoration:none;font-size:18px;font-weight:800}
    .brand img{width:32px;height:32px;object-fit:contain}
    main{width:min(620px,calc(100% - 48px));margin:auto;padding:48px 0 96px}
    .eyebrow{margin:0 0 14px;color:#936e55;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(38px,7vw,64px);line-height:1.02;letter-spacing:-.06em}
    p{max-width:50ch;margin:20px 0 30px;color:#655a51;font-size:17px;line-height:1.55}
    .back{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:#19130f;color:white;text-decoration:none;font-size:14px;font-weight:700}
    .back:focus-visible{outline:3px solid #ff5722;outline-offset:3px}
  </style>
</head>
<body>
  <header><a class="brand" href="./"><img src="logos/wildrose.png" alt="">Rose Workground</a></header>
  <main>
    <div class="eyebrow">In development</div>
    <h1>Context web is coming later.</h1>
    <p>This area is not available yet. You can continue setting up Rose in Builder and Workflows.</p>
    <a class="back" href="./">Back to Workground</a>
  </main>
</body>
</html>
