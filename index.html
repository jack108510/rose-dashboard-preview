<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f4ef" />
  <title>Rose Workground</title>
  <style>
    :root{--bg:#f7f4ef;--panel:#fbf8f2;--ink:#171412;--muted:#81776e;--line:#ded6cc;--line2:#cec4b9;--accent:#ff5722}
    *{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button,textarea{font:inherit}
    .shell{height:100vh;width:100vw;display:grid;grid-template-rows:52px 1fr}.top{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fbf8f2}.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:720;letter-spacing:-.02em}.mark{width:20px;height:20px;border-radius:50%;background:var(--accent)}.head-actions{display:flex;align-items:center;gap:8px}.ghost,.publish-small{height:32px;border-radius:999px;padding:0 12px;font-size:13px}.ghost{border:1px solid var(--line);background:transparent;color:#5d554e}.publish-small{border:0;background:#171412;color:white}
    .main{min-height:0;display:grid;grid-template-columns:minmax(460px,52vw) minmax(420px,1fr)}
    .left{height:calc(100vh - 52px);display:grid;grid-template-rows:1fr auto;border-right:1px solid var(--line);background:var(--bg);min-width:0}.thread{min-height:0;overflow:auto;padding:42px clamp(22px,4vw,56px);display:flex;flex-direction:column;justify-content:flex-end;gap:18px}.empty{height:100%;display:grid;place-items:center;color:#9a9189;font-size:15px}.turn{max-width:740px;width:100%;margin:0 auto;display:grid;gap:7px}.turn.user{justify-items:end}.role{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#978e86;font-weight:760}.bubble{width:fit-content;max-width:100%;border-radius:18px;padding:12px 14px;font-size:15px;line-height:1.48;white-space:pre-wrap}.user .bubble{background:#171412;color:white}.assistant .bubble{background:#fff;border:1px solid var(--line);color:#28221d}
    .composer-wrap{padding:0 clamp(18px,3vw,42px) 24px}.composer{max-width:840px;margin:0 auto;border:1px solid var(--line2);border-radius:20px;background:#fff;box-shadow:0 10px 34px rgba(36,26,18,.08);overflow:hidden}.composer textarea{display:block;width:100%;min-height:72px;max-height:170px;resize:none;border:0;outline:0;background:transparent;padding:18px 18px 8px;color:var(--ink);font-size:16px;line-height:1.45}.composer textarea::placeholder{color:#8f867e}.bar{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 10px;gap:10px}.bar-left,.bar-right{display:flex;align-items:center;gap:8px}.icon,.tool,.model,.send{height:34px;border-radius:999px;border:1px solid var(--line);background:transparent;color:#5e554e;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.icon{width:34px;font-size:20px}.tool,.model{padding:0 12px;font-size:13px}.status{font-size:12px;color:#9a9189}.send{width:34px;background:#171412;color:white;border-color:#171412;font-size:17px}
    .right{height:calc(100vh - 52px);min-width:0;display:grid;grid-template-rows:1fr 92px;background:#f1ece5}.preview{min-height:0;display:grid;place-items:center;padding:8px 24px 0}.slot{width:min(430px,100%);min-height:560px;position:relative;transform:scale(.78);transform-origin:center}#rose-workground-widget{width:100%;min-height:560px;position:relative}.publish{border-top:1px solid var(--line);background:#fbf8f2;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:14px 18px}.versions{display:flex;align-items:center;gap:10px;min-width:0}.version{min-width:0;border:1px solid var(--line);border-radius:14px;background:white;padding:9px 11px}.version b{display:block;font-size:12px;line-height:1.2}.version small{display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--muted);margin-top:2px}.publish-btn{height:46px;border:0;border-radius:14px;background:#171412;color:white;padding:0 20px;font-weight:720;cursor:pointer}.toast{position:fixed;left:26vw;bottom:22px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;background:#171412;color:white;border-radius:999px;padding:8px 12px;font-size:13px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:900px){body{overflow:auto}.shell{height:auto;min-height:100vh}.main{grid-template-columns:1fr}.left{height:560px;border-right:0;border-bottom:1px solid var(--line)}.right{height:auto;min-height:640px}.publish{grid-template-columns:1fr}.versions{display:grid;grid-template-columns:1fr 1fr}.publish-btn{height:46px}.toast{left:50%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><span class="mark"></span><span>Rose Workground</span></div>
      <div class="head-actions"><button class="ghost" type="button">Draft</button><button class="publish-small" id="publishTop" type="button">Publish</button></div>
    </header>
    <section class="main">
      <section class="left" aria-label="Rose command workground">
        <div class="thread" id="messages"><div class="empty" id="emptyState">Type what to change.</div></div>
        <form class="composer-wrap" id="commandForm"><div class="composer"><textarea id="commandInput" rows="1" placeholder="Message Rose…"></textarea><div class="bar"><div class="bar-left"><button class="icon" type="button" aria-label="Add">+</button><button class="tool" type="button">Tools</button></div><div class="bar-right"><span class="status" id="modeText">Preview</span><button class="model" type="button">Rose Builder</button><button class="send" aria-label="Send" type="submit">↑</button></div></div></div></form>
      </section>
      <aside class="right" aria-label="Rose preview and publishing">
        <div class="preview"><div class="slot"><div id="rose-workground-widget" aria-label="Rose widget workground"></div></div></div>
        <section class="publish" aria-label="Publish Rose versions">
          <div class="versions"><div class="version"><b>Live</b><small>Wildrose orange · Rose</small></div><div class="version"><b>Draft</b><small id="draftLabel">Wildrose orange · Rose</small></div></div>
          <button class="publish-btn" id="publishBtn" type="button">Publish version</button>
        </section>
      </aside>
    </section>
  </main>
  <div class="toast" id="toast">Preview updated</div>
  <script src="/rose-dashboard-preview/wildrose-widget-sandbox.js?v=workground-rose-1" data-api-base="https://wildrose-widget.wildeautomations.com" data-title="Rose" data-accent="#ff5722" data-mount="#rose-workground-widget" data-inline="true"></script>
  <script>
    const messages=document.getElementById('messages'),empty=document.getElementById('emptyState'),form=document.getElementById('commandForm'),input=document.getElementById('commandInput'),modeText=document.getElementById('modeText'),toast=document.getElementById('toast'),draftLabel=document.getElementById('draftLabel');
    const state={name:'Rose',accent:'#ff5722',accentLabel:'Wildrose orange',description:'AI intake assistant'};
    const colors={blue:['#2563eb','blue'],cobalt:['#2563eb','blue'],navy:['#1d4ed8','navy'],green:['#2f6b45','moss green'],moss:['#2f6b45','moss green'],purple:['#7c3aed','purple'],plum:['#6d3a7a','plum'],gold:['#c8922a','gold'],orange:['#ff5722','Wildrose orange'],wildrose:['#ff5722','Wildrose orange'],red:['#e23b2e','red'],pink:['#d9468f','pink'],black:['#171412','black']};
    function add(role,text){empty?.remove();const turn=document.createElement('div');turn.className=`turn ${role}`;const label=document.createElement('div');label.className='role';label.textContent=role==='user'?'You':'Rose';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;turn.append(label,bubble);messages.appendChild(turn);messages.scrollTop=messages.scrollHeight}
    function soft(hex){const n=parseInt(hex.replace('#',''),16),mix=v=>Math.round(v+(255-v)*.55);return '#'+[mix((n>>16)&255),mix((n>>8)&255),mix(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('')}
    function applyPreview(){const root=document.querySelector('#rose-workground-widget .wr-ai');if(!root)return setTimeout(applyPreview,100);root.style.setProperty('--accent',state.accent);root.style.setProperty('--accent-soft',soft(state.accent));document.querySelectorAll('#rose-workground-widget .wr-title h3').forEach(el=>el.textContent=state.name);document.querySelectorAll('#rose-workground-widget .wr-title small').forEach(el=>el.textContent=state.description);document.querySelectorAll('#rose-workground-widget .wr-input').forEach(el=>el.placeholder=`Ask ${state.name}…`);draftLabel.textContent=`${state.accentLabel} · ${state.name}`;modeText.textContent='Updated';toast.textContent='Preview updated';toast.classList.add('show');clearTimeout(window.__roseToast);window.__roseToast=setTimeout(()=>toast.classList.remove('show'),1000)}
    function parseName(command){for(const p of[/(?:call|rename|name)\s+(?:the\s+)?(?:assistant|agent|widget|rose|it)?\s*(?:to\s+)?([a-z][a-z\s'-]{1,24})/i,/(?:make\s+(?:it|her|him)\s+called)\s+([a-z][a-z\s'-]{1,24})/i]){const m=command.match(p);if(m)return m[1].split(/\s+and\s+|\s+then\s+|\s*,\s*/i)[0].trim().replace(/\s+/g,' ').replace(/\b\w/g,x=>x.toUpperCase())}return null}
    function run(command){const c=command.toLowerCase(),changes=[];for(const[name,[hex,label]]of Object.entries(colors)){if(c.includes(name)){state.accent=hex;state.accentLabel=label;changes.push(`Accent set to ${label}.`);break}}const newName=parseName(command);if(newName&&!/color|colour|crm|hubspot|connect|tone|blue|green|orange/.test(newName.toLowerCase())){state.name=newName;changes.push(`Renamed to ${newName}.`)}if(c.includes('premium')||c.includes('luxury')||c.includes('cleaner')){state.description='Premium website concierge';changes.push('Tone tightened.')}if(c.includes('friendly')||c.includes('warmer')){state.description='Warm website concierge';changes.push('Tone warmed up.')}if(changes.length){applyPreview();return changes.join(' ')}if(c.includes('crm')||c.includes('hubspot')||c.includes('salesforce')||c.includes('pipedrive'))return 'Connect CRM, test one lead, publish.';if(c.includes('calendar')||c.includes('booking'))return 'Connect booking source, test rules, publish.';if(c.includes('lead')||c.includes('email'))return 'Set lead route, submit test, publish.';return 'Preview the change, test it, publish.'}
    form.addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(!value)return;add('user',value);input.value='';input.style.height='auto';modeText.textContent='Working';setTimeout(()=>add('assistant',run(value)),160)});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,170)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
    function publish(){toast.textContent=`Published ${state.name} · ${state.accentLabel}`;toast.classList.add('show');clearTimeout(window.__roseToast);window.__roseToast=setTimeout(()=>toast.classList.remove('show'),1300);add('assistant',`Published ${state.name} · ${state.accentLabel}.`)}
    document.getElementById('publishBtn').addEventListener('click',publish);document.getElementById('publishTop').addEventListener('click',publish);window.addEventListener('load',()=>setTimeout(applyPreview,650));
  </script>
</body>
</html>
