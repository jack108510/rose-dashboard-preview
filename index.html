<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f0e8" />
  <title>Rose Workground</title>
  <style>
    :root{--paper:#f6f0e8;--surface:#fbf7f0;--ink:#19130f;--muted:#746a61;--line:rgba(25,19,15,.12);--line-strong:rgba(25,19,15,.22);--accent:#ff5722;--shadow:0 28px 90px rgba(54,35,20,.12)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}
    .shell{width:100vw;height:100vh;display:grid;grid-template-rows:58px 1fr;background:var(--paper)}
    .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(251,247,240,.86);backdrop-filter:blur(18px);position:relative;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:720;letter-spacing:-.02em}.brand i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff 0 12%,#ffb49b 20%,var(--accent) 62%,#9a2b12)}.sections{justify-self:center;display:flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(255,250,243,.72)}.section-tab{height:30px;border:0;border-radius:999px;background:transparent;color:#6d6259;padding:0 12px;font-size:13px}.section-tab.active{background:#fff;color:#19130f;box-shadow:0 6px 18px rgba(44,31,20,.08)}.top-actions{justify-self:end;display:flex;align-items:center;gap:9px}.chip{height:34px;border:1px solid var(--line);border-radius:999px;background:#fffaf3;color:#594f47;padding:0 12px;font-size:13px}.publish-top{height:34px;border:0;border-radius:999px;background:#19130f;color:#fff;padding:0 14px;font-size:13px;box-shadow:0 10px 26px rgba(25,19,15,.16)}
    .app{min-height:0;display:grid;grid-template-columns:minmax(460px,52vw) minmax(430px,1fr)}.app.page-mode{grid-template-columns:1fr}.app.page-mode .right{display:none}.app.page-mode .llm{border-right:0;background:var(--paper);grid-template-rows:1fr}.app.page-mode .composer-wrap{display:none}.app.page-mode .thread{justify-content:flex-start;padding:46px clamp(24px,6vw,86px)}
    .llm{height:calc(100vh - 58px);min-width:0;background:radial-gradient(circle at 17% 18%,rgba(255,87,34,.07),transparent 32%),var(--surface);border-right:1px solid var(--line);display:grid;grid-template-rows:1fr auto;overflow:hidden}.thread{overflow:auto;padding:clamp(28px,5vw,72px) clamp(24px,5vw,76px) 24px;display:flex;flex-direction:column;justify-content:center;gap:24px;min-height:0}.empty{width:100%;max-width:720px;margin:0 auto}.empty h1{margin:0;font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:clamp(48px,5.8vw,86px);line-height:.94;letter-spacing:-.066em;font-weight:520}.turn{width:min(720px,100%);margin:0 auto;display:grid;gap:8px}.turn.user{justify-items:end}.role{color:#8b8178;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:780}.bubble{width:fit-content;max-width:100%;border-radius:20px;padding:14px 16px;font-size:15px;line-height:1.48;white-space:pre-wrap}.assistant .bubble{background:rgba(255,255,255,.66);border:1px solid rgba(25,19,15,.09);color:#2c231d}.user .bubble{background:#19130f;color:white}
    .composer-wrap{padding:0 clamp(16px,3vw,42px) clamp(16px,3vw,32px)}.composer{width:100%;max-width:none;margin:0;border:1px solid var(--line-strong);border-radius:24px;background:#fffaf3;box-shadow:0 18px 55px rgba(54,35,20,.13);overflow:hidden}.composer textarea{width:100%;min-height:76px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);padding:20px 20px 10px;line-height:1.45;font-size:16px;display:block}.composer textarea::placeholder{color:#8d837a}.bar{height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px 12px}.bar-left,.bar-right{display:flex;align-items:center;gap:8px;min-width:0}.icon,.tool,.model,.send{border:1px solid var(--line);background:transparent;color:#5a5149;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.icon{width:36px;font-size:22px;line-height:1}.tool{padding:0 13px;font-size:13px}.model{padding:0 12px;font-size:13px;max-width:190px;overflow:hidden;text-overflow:ellipsis}.send{width:36px;background:var(--ink);color:white;border-color:var(--ink);font-size:18px}.mode{color:#9a9087;font-size:12px;padding:0 4px}
    .right{height:calc(100vh - 58px);min-width:0;display:grid;grid-template-rows:1fr;background:radial-gradient(circle at 50% 22%,rgba(255,87,34,.11),transparent 34%),linear-gradient(135deg,#f7f1e8,#efe5d8);overflow:hidden}.preview{min-height:0;display:grid;place-items:center;position:relative;padding:24px}.widget-slot{width:min(430px,100%);min-height:560px;position:relative;z-index:1}#rose-workground-widget{width:100%;min-height:560px;position:relative}
    .page{width:min(1120px,100%);margin:0 auto;display:grid;gap:22px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}.page-kicker{font-size:12px;font-weight:820;letter-spacing:.12em;text-transform:uppercase;color:#8b8178}.page h1{margin:5px 0 0;font-size:44px;line-height:.96;letter-spacing:-.045em}.page p{margin:0;color:#736960}.page-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid rgba(25,19,15,.1);background:rgba(255,255,255,.62);border-radius:20px;padding:16px;display:grid;gap:12px}.card h3{margin:0;font-size:16px;letter-spacing:-.02em}.card small{color:#766c63;line-height:1.35}.row{display:grid;gap:6px}.row label{font-size:12px;font-weight:760;color:#786e65}.input,.select,.area{width:100%;border:1px solid var(--line);border-radius:13px;background:#fffaf3;color:var(--ink);padding:10px 12px;outline:0}.area{min-height:74px;resize:vertical}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid rgba(25,19,15,.08);padding-top:11px}.toggle{width:44px;height:26px;border:0;border-radius:999px;background:#d8cfc5;position:relative}.toggle:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:white;transition:.18s ease}.toggle.on{background:#19130f}.toggle.on:after{left:21px}.save{height:38px;border:0;border-radius:999px;background:#19130f;color:white;padding:0 16px;justify-self:start}.status{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;background:#fffaf3;padding:6px 10px;font-size:12px;color:#675d54}.pill.on{background:#19130f;color:white;border-color:#19130f}.suggestion{width:100%;height:100%;text-align:left;border:1px solid rgba(25,19,15,.1);background:rgba(255,255,255,.62);border-radius:18px;padding:14px 15px;display:grid;grid-template-columns:auto 1fr;gap:12px}.suggestion:hover,.card:hover{background:#fff}.rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#19130f;color:#fff;font-size:12px;font-weight:780}.suggestion b{display:block;font-size:15px;letter-spacing:-.02em}.suggestion span{display:block;margin-top:3px;color:#776d64;font-size:13px;line-height:1.35}.suggestion.high{border-color:rgba(255,87,34,.22);box-shadow:0 12px 30px rgba(255,87,34,.07)}.suggestion.alert{border-color:rgba(205,80,32,.32);background:#fff7f2}.suggestion.alert .rank{background:#c94d20}.connect-panel{border:1px solid rgba(25,19,15,.12);background:#fffaf3;border-radius:20px;padding:16px;display:grid;gap:12px}.connect-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.connect-head b{font-size:16px}.connect-head span{font-size:12px;color:#746a61}.connect-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.connector{border:1px solid rgba(25,19,15,.1);border-radius:16px;background:white;padding:12px;text-align:left}.connector b{display:block;font-size:14px}.connector span{display:block;margin-top:3px;color:#776d64;font-size:12px;line-height:1.3}.connect-cta{height:34px;border:0;border-radius:999px;background:#19130f;color:white;padding:0 12px;font-size:12px;justify-self:start}.toast{position:fixed;left:calc(26vw);bottom:24px;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;padding:9px 13px;border-radius:999px;background:rgba(25,19,15,.92);color:white;font-size:13px;transition:.22s ease;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.app.page-mode~.toast{left:50%}
    @media(max-width:900px){body{overflow:auto}.shell{height:auto;min-height:100vh}.top{height:auto;min-height:58px;display:flex;flex-direction:column;align-items:flex-start;padding:14px 16px}.sections{justify-self:start}.app,.app.page-mode{grid-template-columns:1fr}.llm{height:min(680px,calc(100vh - 58px));border-right:0;border-bottom:1px solid var(--line)}.app.page-mode .llm{height:auto;min-height:760px}.right{height:auto;min-height:720px}.page-grid{grid-template-columns:1fr}.empty h1{font-size:46px}.toast{left:50%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><i></i><span>Rose Workground</span></div>
      <nav class="sections" aria-label="Rose sections">
        <button class="section-tab active" type="button" data-section="Appearance">Appearance</button>
        <button class="section-tab" type="button" data-section="Suggestions">Suggestions</button>
        <button class="section-tab" type="button" data-section="Settings">Settings</button>
      </nav>
      <div class="top-actions"><button class="chip" type="button" id="draftChip">Draft v3</button><button class="publish-top" id="publishTop" type="button">Publish</button></div>
    </header>
    <section class="app">
      <section class="llm" aria-label="Rose command workground">
        <div class="thread" id="messages"><div class="empty" id="emptyState"><h1>What should Rose change?</h1></div></div>
        <form class="composer-wrap" id="commandForm"><div class="composer"><textarea id="commandInput" rows="1" placeholder="Message Rose…"></textarea><div class="bar"><div class="bar-left"><button class="icon" type="button" aria-label="Add">+</button><button class="tool" type="button">Tools</button></div><div class="bar-right"><span class="mode" id="modeText">Preview</span><button class="model" type="button">Rose Builder</button><button class="send" aria-label="Send" type="submit">↑</button></div></div></div></form>
      </section>
      <aside class="right" aria-label="Rose preview and publishing"><div class="preview"><div class="widget-slot"><div id="rose-workground-widget" aria-label="Rose widget workground"></div></div></div></aside>
    </section>
  </main>
  <div class="toast" id="toast">Preview updated</div>
  <script src="/rose-dashboard-preview/wildrose-widget-sandbox.js?v=workground-rose-1" data-api-base="https://wildrose-widget.wildeautomations.com" data-title="Rose" data-accent="#ff5722" data-mount="#rose-workground-widget" data-inline="true"></script>
  <script>
    const app=document.querySelector('.app'),messages=document.getElementById('messages'),form=document.getElementById('commandForm'),input=document.getElementById('commandInput'),modeText=document.getElementById('modeText'),toast=document.getElementById('toast'),draftChip=document.getElementById('draftChip');
    const state={name:'Rose',accent:'#ff5722',accentLabel:'Wildrose orange',description:'AI intake assistant'};
    const settings={ownerEmail:'owner@company.com',backupEmail:'',phone:'',crm:'HubSpot',forwardUnknown:true,requireTests:true,email:true,sms:false,crmEnabled:false,calendar:false,slack:false,rules:'Forward pricing exceptions, booking confirmations, complaints, refunds, and anything Rose is not confident about.'};
    const flagged=[],connectionQueue=[];
    const colors={blue:['#2563eb','blue'],cobalt:['#2563eb','blue'],navy:['#1d4ed8','navy'],green:['#2f6b45','moss green'],moss:['#2f6b45','moss green'],purple:['#7c3aed','purple'],plum:['#6d3a7a','plum'],gold:['#c8922a','gold'],orange:['#ff5722','Wildrose orange'],wildrose:['#ff5722','Wildrose orange'],red:['#e23b2e','red'],pink:['#d9468f','pink'],black:['#19130f','black']};
    const connectorCopy={crm:['HubSpot / CRM','Create or update a contact from every qualified lead.'],email:['Gmail','Send owner lead emails and follow-up messages.'],calendar:['Google Calendar','Check booking rules and create follow-up events.'],phone:['SMS / phone alerts','Trigger instant hot-lead alerts through the phone connector.'],slack:['Slack','Post lead alerts into the right team channel.']};
    function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(window.__roseToast);window.__roseToast=setTimeout(()=>toast.classList.remove('show'),1300)}
    function add(role,text){document.querySelectorAll('.section-panel,.page').forEach(el=>el.remove());const empty=document.getElementById('emptyState');empty?.remove();const turn=document.createElement('div');turn.className=`turn ${role}`;const label=document.createElement('div');label.className='role';label.textContent=role==='user'?'You':'Rose';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;turn.append(label,bubble);messages.appendChild(turn);messages.style.justifyContent='flex-start';messages.scrollTop=messages.scrollHeight}
    function soft(hex){const n=parseInt(hex.replace('#',''),16),mix=v=>Math.round(v+(255-v)*.55);return '#'+[mix((n>>16)&255),mix((n>>8)&255),mix(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('')}
    function applyPreview(){const root=document.querySelector('#rose-workground-widget .wr-ai');if(!root)return setTimeout(applyPreview,100);root.style.setProperty('--accent',state.accent);root.style.setProperty('--accent-soft',soft(state.accent));document.querySelectorAll('#rose-workground-widget .wr-title h3').forEach(el=>el.textContent=state.name);document.querySelectorAll('#rose-workground-widget .wr-title small').forEach(el=>el.textContent=state.description);document.querySelectorAll('#rose-workground-widget .wr-input').forEach(el=>el.placeholder=`Ask ${state.name}…`);modeText.textContent='Updated';notify('Preview updated')}
    function parseName(command){for(const p of[/(?:call|rename|name)\s+(?:the\s+)?(?:assistant|agent|widget|rose|it)?\s*(?:to\s+)?([a-z][a-z\s'-]{1,24})/i,/(?:make\s+(?:it|her|him)\s+called)\s+([a-z][a-z\s'-]{1,24})/i]){const m=command.match(p);if(m)return m[1].split(/\s+and\s+|\s+then\s+|\s*,\s*/i)[0].trim().replace(/\s+/g,' ').replace(/\b\w/g,x=>x.toUpperCase())}return null}
    function flagUnanswered(command){const cleaned=command.replace(/customer asked|visitor asked|rose can(?:not|'t) answer|can't answer|couldn't answer|doesn't know|unanswered|unknown/ig,'').replace(/\brose\b/ig,'').replace(/\s+/g,' ').replace(/\s+(and|but|so)\s*$/i,'').trim();flagged.unshift(cleaned||'Customer asked something Rose could not answer');showSection('Suggestions');notify('Added to Suggestions')}
    function queueConnection(kind){if(!connectionQueue.includes(kind))connectionQueue.unshift(kind);showSection('Suggestions');notify('Composio connection ready')}
    function run(command){const c=command.toLowerCase(),changes=[];if(/customer asked|visitor asked|can't answer|cannot answer|couldn't answer|doesn't know|unanswered|unknown/.test(c)){setTimeout(()=>flagUnanswered(command),220);return 'Added it to Suggestions as a missing-context item. The next step is to add the answer, then re-test Rose against that question.'}for(const[name,[hex,label]]of Object.entries(colors)){if(c.includes(name)){state.accent=hex;state.accentLabel=label;changes.push(`Accent set to ${label}.`);break}}const newName=parseName(command);if(newName&&!/color|colour|crm|hubspot|connect|tone|blue|green|orange/.test(newName.toLowerCase())){state.name=newName;changes.push(`Renamed to ${newName}.`)}if(c.includes('premium')||c.includes('luxury')||c.includes('cleaner')){state.description='Premium website concierge';changes.push('Tone tightened.')}if(c.includes('friendly')||c.includes('warmer')){state.description='Warm website concierge';changes.push('Tone warmed up.')}if(changes.length){applyPreview();return changes.join(' ')}if(c.includes('crm')||c.includes('hubspot')||c.includes('salesforce')||c.includes('pipedrive')){setTimeout(()=>queueConnection('crm'),220);return 'Ready to connect CRM through Composio: choose the CRM, authorize, send one test lead, then publish.'}if(c.includes('phone')||c.includes('sms')||c.includes('text')){setTimeout(()=>queueConnection('phone'),220);return 'Ready to connect phone alerts through Composio: authorize the phone/SMS connector, test one hot lead alert, then publish.'}if(c.includes('calendar')||c.includes('booking')){setTimeout(()=>queueConnection('calendar'),220);return 'Ready to connect calendar through Composio: authorize, set confirmation rules, test availability boundaries, then publish.'}if(c.includes('slack')){setTimeout(()=>queueConnection('slack'),220);return 'Ready to connect Slack through Composio: authorize, choose the alert channel, send one test lead, then publish.'}if(c.includes('lead')||c.includes('email')||c.includes('gmail')){setTimeout(()=>queueConnection('email'),220);return 'Ready to connect email through Composio: authorize Gmail, send a test lead email, then publish.'}return 'I’d preview that as a Rose config change, test it here, then publish it to the installed widget.'}
    function suggestionsHtml(){const dynamic=flagged.map(q=>`<button class="suggestion alert" data-command="Add context answer for: ${q.replace(/"/g,'&quot;')}"><span class="rank">!</span><div><b>Unanswered customer request</b><span>${q}</span></div></button>`).join('');const queued=connectionQueue.map(kind=>{const c=connectorCopy[kind]||connectorCopy.crm;return `<div class="connect-panel"><div class="connect-head"><b>${c[0]}</b><span>Composio OAuth</span></div><div class="connect-grid"><button class="connector" data-command="Authorize ${c[0]} with Composio"><b>Authorize</b><span>Open hosted Composio connect link.</span></button><button class="connector" data-command="Send a test lead through ${c[0]}"><b>Test</b><span>${c[1]}</span></button></div><button class="connect-cta" data-command="Connect ${c[0]} with Composio">Connect with Composio</button></div>`}).join('');return `<div class="page suggestions-page"><div class="page-head"><div><div class="page-kicker">Suggestions</div><h1>Most important first.</h1></div><p>Website context first, owner chat second, connections and tests after.</p></div><div class="page-grid">${dynamic}${queued}<button class="suggestion high" data-command="Scrape the website and build Rose context"><span class="rank">1</span><div><b>Pull context from website</b><span>Get as much as possible from the site first: services, hours, pricing, FAQs, policies, tone.</span></div></button><button class="suggestion high" data-command="Run a context grader and show missing info"><span class="rank">2</span><div><b>Run context grader</b><span>Score what Rose knows, flag gaps, and identify risky answers before publishing.</span></div></button><button class="suggestion high" data-command="Ask me for missing context in chat"><span class="rank">3</span><div><b>Fill missing context in chat</b><span>Ask the owner only what the website could not answer.</span></div></button><button class="suggestion" data-command="Route lead emails to me"><span class="rank">4</span><div><b>Route lead emails</b><span>Connect Gmail through Composio and send every new lead to the owner/team inbox.</span></div></button><button class="suggestion" data-command="Add phone number alerts for new leads"><span class="rank">5</span><div><b>Phone alerts for hot leads</b><span>Use Composio to authorize phone/SMS alerts for high-intent leads.</span></div></button><button class="suggestion" data-command="Connect my CRM"><span class="rank">6</span><div><b>Connect CRM</b><span>Use Composio OAuth for HubSpot, Pipedrive, Salesforce, Airtable, or Sheets.</span></div></button><button class="suggestion" data-command="Test chat voice and lead routing"><span class="rank">7</span><div><b>Test before publish</b><span>Run chat, voice, and lead delivery tests against connected services.</span></div></button></div></div>`}
    function settingsHtml(){return `<div class="page settings-page"><div class="page-head"><div><div class="page-kicker">Settings</div><h1>Make Rose operational.</h1></div><p>Real routing controls, publish rules, and Composio-managed connections.</p></div><div class="page-grid"><div class="card"><h3>Lead delivery</h3><small>Where captured leads go first.</small><div class="row"><label>Owner email</label><input class="input" id="ownerEmail" value="${settings.ownerEmail}"></div><div class="row"><label>Backup email</label><input class="input" id="backupEmail" placeholder="optional" value="${settings.backupEmail}"></div><div class="row"><label>Phone alerts</label><input class="input" id="phone" placeholder="+1 555 000 0000" value="${settings.phone}"></div><button class="save" id="saveSettings" type="button">Save settings</button></div><div class="card"><h3>Connections</h3><small>Use Composio OAuth so Rose never stores raw app passwords.</small>${toggleHtml('email','Email via Gmail')}${toggleHtml('sms','Phone/SMS alerts')}${toggleHtml('crmEnabled','CRM sync')}${toggleHtml('calendar','Calendar handoff')}${toggleHtml('slack','Slack alerts')}<div class="row"><label>Preferred CRM</label><select class="select" id="crmSelect"><option>HubSpot</option><option>Pipedrive</option><option>Salesforce</option><option>Airtable</option><option>Google Sheets</option></select></div></div><div class="card"><h3>Answer boundaries</h3><small>When Rose cannot answer, it should create a Suggestion instead of guessing.</small>${toggleHtml('forwardUnknown','Forward unknown questions')}${toggleHtml('requireTests','Require tests before publish')}<div class="row"><label>Must-forward rules</label><textarea class="area" id="rules">${settings.rules}</textarea></div></div><div class="card"><h3>Current routing state</h3><small>Saved locally in this preview; production uses the Rose backend workspace.</small><div class="status" id="settingsStatus">${statusPills()}</div><button class="save" type="button" data-command="Test chat voice and lead routing">Run delivery test</button></div></div></div>`}
    function toggleHtml(key,label){return `<div class="toggle-row"><span>${label}</span><button class="toggle ${settings[key]?'on':''}" type="button" data-toggle="${key}" aria-label="${label}"></button></div>`}
    function statusPills(){return [`Email ${settings.email?'on':'off'}`,`SMS ${settings.sms?'on':'off'}`,`CRM ${settings.crmEnabled?settings.crm:'off'}`,`Calendar ${settings.calendar?'on':'off'}`,`Tests ${settings.requireTests?'required':'optional'}`].map((t,i)=>`<span class="pill ${/on|HubSpot|Pipedrive|Salesforce|Airtable|Sheets|required/.test(t)?'on':''}">${t}</span>`).join('')}
    function wirePage(){document.querySelectorAll('[data-command]').forEach(btn=>btn.addEventListener('click',()=>{showSection('Appearance');input.value=btn.dataset.command;input.focus();modeText.textContent='Ready'}));document.querySelectorAll('[data-toggle]').forEach(btn=>btn.addEventListener('click',()=>{const key=btn.dataset.toggle;settings[key]=!settings[key];btn.classList.toggle('on',settings[key]);const status=document.getElementById('settingsStatus');if(status)status.innerHTML=statusPills();notify(`${btn.previousElementSibling.textContent} ${settings[key]?'on':'off'}`)}));document.getElementById('saveSettings')?.addEventListener('click',()=>{settings.ownerEmail=document.getElementById('ownerEmail').value.trim();settings.backupEmail=document.getElementById('backupEmail').value.trim();settings.phone=document.getElementById('phone').value.trim();settings.crm=document.getElementById('crmSelect').value;settings.rules=document.getElementById('rules').value.trim();const status=document.getElementById('settingsStatus');if(status)status.innerHTML=statusPills();notify('Settings saved')});const crm=document.getElementById('crmSelect');if(crm)crm.value=settings.crm}
    function showSection(name){document.querySelectorAll('.section-tab').forEach(t=>t.classList.toggle('active',t.dataset.section===name));app.classList.toggle('page-mode',name!=='Appearance');messages.innerHTML=name==='Suggestions'?suggestionsHtml():name==='Settings'?settingsHtml():'<div class="empty" id="emptyState"><h1>What should Rose change?</h1></div>';messages.style.justifyContent=name==='Appearance'?'center':'flex-start';wirePage();modeText.textContent=name==='Appearance'?'Preview':name}
    form.addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(!value)return;add('user',value);input.value='';input.style.height='auto';modeText.textContent='Working';setTimeout(()=>add('assistant',run(value)),180)});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
    function publish(){draftChip.textContent='Published';notify(`Published ${state.name} · ${state.accentLabel}`);add('assistant',`Published preview version: ${state.name} · ${state.accentLabel}.`)}
    document.querySelectorAll('.section-tab').forEach(tab=>tab.addEventListener('click',()=>showSection(tab.dataset.section)));document.getElementById('publishTop').addEventListener('click',publish);window.addEventListener('load',()=>setTimeout(applyPreview,650));
  </script>
</body>
</html>
