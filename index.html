g-bottom:14px}.suggestions-page .page-head h1{font-size:40px}.launch-panel{grid-template-columns:150px minmax(0,1fr) 220px;padding:18px;border-radius:24px}.score-big{font-size:48px}.blockers b{font-size:14px}.blocker{font-size:12.5px}.next-actions button{justify-content:center}.filters{position:sticky;top:0;z-index:5;background:rgba(246,240,232,.9);backdrop-filter:blur(10px);padding:8px 0}.suggestions-board{display:block}.priority-rail{display:none}.suggestion-groups{grid-template-columns:1fr;gap:12px}.sug-group{border:0;background:transparent;padding:0;gap:8px}.sug-group h3{padding:16px 2px 4px;font-size:12px;color:#8a8077}.leader-head{grid-template-columns:54px 44px minmax(0,1fr) 68px;padding:0 14px 4px;font-size:10px}.sug-card{grid-template-columns:54px 44px minmax(0,1fr) 68px;padding:12px 14px;border-radius:16px;background:rgba(255,250,243,.78);box-shadow:none}.sug-card:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(54,35,20,.06)}.rank-col{font-size:12px;color:#8a8077}.app-logo{width:36px;height:36px;border-radius:12px}.app-logo img{width:22px;height:22px}.sug-top{align-items:flex-start}.sug-top b{line-height:1.15}.sug-card span{font-size:12.5px}.labels{justify-content:flex-end}.tag,.status-chip{font-size:10.5px;padding:3px 7px}.score{justify-self:end;font-size:11px;padding:5px 8px}@media(max-width:1180px){.suggestions-page{width:min(860px,100%)}.launch-panel{grid-template-columns:1fr;gap:12px}.next-actions{grid-template-columns:repeat(2,minmax(0,1fr))}.leader-head{display:none}.sug-card{grid-template-columns:46px 40px minmax(0,1fr);position:relative}.sug-card .score{position:absolute;right:12px;top:12px}.sug-meta{padding-right:58px}.filters{top:0}.suggestions-page .page-head{align-items:flex-start;flex-direction:column}.onboard-summary{justify-content:flex-start}}.toast{position:fixed;left:calc(26vw);bottom:24px;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;padding:9px 13px;border-radius:999px;background:rgba(25,19,15,. <body>
  <main class="shell">
    <header class="top">
      <div class="brand"><i></i><span>Rose Workground</span></div>
      <nav class="sections" aria-label="Rose sections">
        <button class="section-tab active" type="button" data-section="Appearance">Appearance</button>
        <button class="section-tab" type="button" data-section="Suggestions">Suggestions</button>
        <button class="section-tab" type="button" data-section="Settings">Settings</button>
      </nav>
      <div class="top-actions"><button class="chip" type="button" id="draftChip">Draft v3</button><button class="publish-top" id="publishTop" type="button">Publish</button></div>
    </header>
    <section class="app">
      <section class="llm" aria-label="Rose command workground">
        <div class="thread" id="messages"><div class="empty" id="emptyState"><h1>What should Rose change?</h1></div></div>
        <form class="composer-wrap" id="commandForm"><div class="composer"><textarea id="commandInput" rows="1" placeholder="Message Rose…"></textarea><div class="bar"><div class="bar-left"><button class="icon" type="button" aria-label="Add">+</button><button class="tool" type="button">Tools</button></div><div class="bar-right"><span class="mode" id="modeText">Preview</span><button class="model" type="button">Rose Builder</button><button class="send" aria-label="Send" type="submit">↑</button></div></div></div></form>
      </section>
      <aside class="right" aria-label="Rose preview and publishing"><div class="preview"><div class="widget-slot"><div id="rose-workground-widget" aria-label="Rose widget workground"></div></div></div></aside>
    </section>
  </main>
  <div class="toast" id="toast">Preview updated</div>
  <script src="/rose-dashboard-preview/wildrose-widget-sandbox.js?v=workground-rose-1" data-api-base="https://wildrose-widget.wildeautomations.com" data-title="Rose" data-build="readiness-1" data-accent="#ff5722" data-mount="#rose-workground-widget" data-inline="true"></script>
  <script>
    const app=document.querySelector('.app'),messages=document.getElementById('messages'),form=document.getElementById('commandForm'),input=document.getElementById('commandInput'),modeText=document.getElementById('modeText'),toast=document.getElementById('toast'),draftChip=document.getElementById('draftChip');
    const state={name:'Rose',accent:'#ff5722',accentLabel:'Wildrose orange',description:'AI intake assistant'};
    const settings={ownerEmail:'owner@company.com',backupEmail:'',phone:'',crm:'HubSpot',forwardUnknown:true,requireTests:true,email:true,sms:false,crmEnabled:false,calendar:false,slack:false,rules:'Forward pricing exceptions, booking confirmations, complaints, refunds, and anything Rose is not confident about.'};
    const flagged=[],connectionQueue=[];
    const colors={blue:['#2563eb','blue'],cobalt:['#2563eb','blue'],navy:['#1d4ed8','navy'],green:['#2f6b45','moss green'],moss:['#2f6b45','moss green'],purple:['#7c3aed','purple'],plum:['#6d3a7a','plum'],gold:['#c8922a','gold'],orange:['#ff5722','Wildrose orange'],wildrose:['#ff5722','Wildrose orange'],red:['#e23b2e','red'],pink:['#d9468f','pink'],black:['#19130f','black']};
    const connectorCopy={crm:['HubSpot / CRM','Create or update a contact from every qualified lead.'],email:['Gmail','Send owner lead emails and follow-up messages.'],calendar:['Google Calendar','Check booking rules and create follow-up events.'],phone:['SMS / phone alerts','Trigger instant hot-lead alerts through the phone connector.'],slack:['Slack','Post lead alerts into the right team channel.']};
    function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(window.__roseToast);window.__roseToast=setTimeout(()=>toast.classList.remove('show'),1300)}
    function add(role,text){document.querySelectorAll('.section-panel,.page').forEach(el=>el.remove());const empty=document.getElementById('emptyState');empty?.remove();const turn=document.createElement('div');turn.className=`turn ${role}`;const label=document.createElement('div');label.className='role';label.textContent=role==='user'?'You':'Rose';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;turn.append(label,bubble);messages.appendChild(turn);messages.style.justifyContent='flex-start';messages.scrollTop=messages.scrollHeight}
    function soft(hex){const n=parseInt(hex.replace('#',''),16),mix=v=>Math.round(v+(255-v)*.55);return '#'+[mix((n>>16)&255),mix((n>>8)&255),mix(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('')}
    function applyPreview(){const root=document.querySelector('#rose-workground-widget .wr-ai');if(!root)return setTimeout(applyPreview,100);root.style.setProperty('--accent',state.accent);root.style.setProperty('--accent-soft',soft(state.accent));document.querySelectorAll('#rose-workground-widget .wr-title h3').forEach(el=>el.textContent=state.name);document.querySelectorAll('#rose-workground-widget .wr-title small').forEach(el=>el.textContent=state.description);document.querySelectorAll('#rose-workground-widget .wr-input').forEach(el=>el.placeholder=`Ask ${state.name}…`);modeText.textContent='Updated';notify('Preview updated')}
    function parseName(command){for(const p of[/(?:call|rename|name)\s+(?:the\s+)?(?:assistant|agent|widget|rose|it)?\s*(?:to\s+)?([a-z][a-z\s'-]{1,24})/i,/(?:make\s+(?:it|her|him)\s+called)\s+([a-z][a-z\s'-]{1,24})/i]){const m=command.match(p);if(m)return m[1].split(/\s+and\s+|\s+then\s+|\s*,\s*/i)[0].trim().replace(/\s+/g,' ').replace(/\b\w/g,x=>x.toUpperCase())}return null}
    function flagUnanswered(command){const cleaned=command.replace(/customer asked|visitor asked|rose can(?:not|'t) answer|can't answer|couldn't answer|doesn't know|unanswered|unknown/ig,'').replace(/\brose\b/ig,'').replace(/\s+/g,' ').replace(/\s+(and|but|so)\s*$/i,'').trim();flagged.unshift(cleaned||'Customer asked something Rose could not answer');showSection('Suggestions');notify('Added to Suggestions')}
    function queueConnection(kind){if(!connectionQueue.includes(kind))connectionQueue.unshift(kind);showSection('Suggestions');notify('Composio connection ready')}
    function run(command){const c=command.toLowerCase(),changes=[];if(/customer asked|visitor asked|can't answer|cannot answer|couldn't answer|doesn't know|unanswered|unknown/.test(c)){setTimeout(()=>flagUnanswered(command),220);return 'Added it to Suggestions as a missing-context item. The next step is to add the answer, then re-test Rose against that question.'}for(const[name,[hex,label]]of Object.entries(colors)){if(c.includes(name)){state.accent=hex;state.accentLabel=label;changes.push(`Accent set to ${label}.`);break}}const newName=parseName(command);if(newName&&!/color|colour|crm|hubspot|connect|tone|blue|green|orange/.test(newName.toLowerCase())){state.name=newName;changes.push(`Renamed to ${newName}.`)}if(c.includes('premium')||c.includes('luxury')||c.includes('cleaner')){state.description='Premium website concierge';changes.push('Tone tightened.')}if(c.includes('friendly')||c.includes('warmer')){state.description='Warm website concierge';changes.push('Tone warmed up.')}if(changes.length){applyPreview();return changes.join(' ')}if(c.includes('crm')||c.includes('hubspot')||c.includes('salesforce')||c.includes('pipedrive')){setTimeout(()=>queueConnection('crm'),220);return 'Ready to connect CRM through Composio: choose the CRM, authorize, send one test lead, then publish.'}if(c.includes('phone')||c.includes('sms')||c.includes('text')){setTimeout(()=>queueConnection('phone'),220);return 'Ready to connect phone alerts through Composio: authorize the phone/SMS connector, test one hot lead alert, then publish.'}if(c.includes('calendar')||c.includes('booking')){setTimeout(()=>queueConnection('calendar'),220);return 'Ready to connect calendar through Composio: authorize, set confirmation rules, test availability boundaries, then publish.'}if(c.includes('slack')){setTimeout(()=>queueConnection('slack'),220);return 'Ready to connect Slack through Composio: authorize, choose the alert channel, send one test lead, then publish.'}if(c.includes('lead')||c.includes('email')||c.includes('gmail')){setTimeout(()=>queueConnection('email'),220);return 'Ready to connect email through Composio: authorize Gmail, send a test lead email, then publish.'}return 'I’d preview that as a Rose config change, test it here, then publish it to the installed widget.'}
    let sugRank=0;
    function logoFor(title,tag){const t=(title+' '+tag).toLowerCase(),ddg='https://icons.duckduckgo.com/ip3/';if(t.includes('salesforce'))return [ddg+'salesforce.com.ico','Salesforce'];if(t.includes('pipedrive'))return [ddg+'pipedrive.com.ico','Pipedrive'];if(t.includes('airtable'))return [ddg+'airtable.com.ico','Airtable'];if(t.includes('hubspot')||t.includes('crm'))return [ddg+'hubspot.com.ico','HubSpot'];if(t.includes('gmail')||t.includes('email'))return [ddg+'mail.google.com.ico','Gmail'];if(t.includes('calendly'))return [ddg+'calendly.com.ico','Calendly'];if(t.includes('calendar')||t.includes('booking'))return [ddg+'calendar.google.com.ico','Google Calendar'];if(t.includes('slack'))return [ddg+'slack.com.ico','Slack'];if(t.includes('sheet'))return [ddg+'sheets.google.com.ico','Google Sheets'];if(t.includes('zendesk')||t.includes('support'))return [ddg+'zendesk.com.ico','Zendesk'];if(t.includes('twilio')||t.includes('phone')||t.includes('sms'))return [ddg+'twilio.com.ico','Twilio'];return ['', 'Rose']}
    function logoBadge(title,tag,extra=''){const [src,alt]=logoFor(title,tag);return `<span class="app-logo logo-real ${extra}">${src?`<img src="${src}" alt="${alt} logo" referrerpolicy="no-referrer">`:'R'}</span>`}
    function statusFor(tag,hot,title){if(title.toLowerCase().includes('publish'))return 'Test needed';if(tag==='Composio')return 'Connect app';if(hot||tag==='High')return 'Required';if(tag==='AI')return 'Needs owner';if(tag==='Test')return 'Test needed';return 'Recommended'}
    function sug(title,body,tag,command,hot=false){const n=++sugRank,score=hot?'98%':tag==='Composio'?'94%':tag==='AI'?'91%':tag==='Test'?'86%':'82%',status=statusFor(tag,hot,title),filter=status.includes('Connect')?'Connections':status.includes('Required')?'Required':status.includes('Needs')?'Missing context':status.includes('Test')?'Testing':'Recommended';return `<button class="sug-card" data-filter="${filter}" data-status="${status}" data-command="${command.replace(/"/g,'&quot;')}"><span class="rank-col">#${String(n).padStart(2,'0')}</span>${logoBadge(title,tag)}<div class="sug-meta"><div class="sug-top"><b>${title}</b><span class="labels"><em class="tag ${hot?'hot':tag==='AI'?'ai':''}">${tag}</em><i class="status-chip ${status.includes('Connect')?'connect':status.includes('Needs')?'need':''}">${status}</i></span></div><span>${body}</span></div><strong class="score ${hot?'hot':''}">${score}</strong></button>`}
    function suggestionsHtml(){
      sugRank=0;
      const dynamic=flagged.map(q=>`<button class="sug-card" data-filter="Missing context" data-status="Needs owner" data-command="Add context answer for: ${q.replace(/"/g,'&quot;')}"><span class="rank-col">#00</span><span class="app-logo logo-rose">!</span><div class="sug-meta"><div class="sug-top"><b>Unanswered customer request</b><em class="tag hot">Fix now</em></div><span>${q}</span></div><strong class="score hot">100%</strong></button>`).join('');
      const queued=connectionQueue.map(kind=>{const c=connectorCopy[kind]||connectorCopy.crm;return `<div class="connect-panel"><div class="connect-head"><b>${logoBadge(c[0],'Composio','mini')}${c[0]}</b><span>Composio OAuth</span></div><div class="connect-grid"><button class="connector" data-command="Authorize ${c[0]} with Composio"><b>Authorize</b><span>Open hosted Composio connect link.</span></button><button class="connector" data-command="Send a test lead through ${c[0]}"><b>Test</b><span>${c[1]}</span></button></div><button class="connect-cta" data-command="Connect ${c[0]} with Composio">Connect with Composio</button></div>`}).join('');
      const groups=[['Context gaps', [['Pull context from website','Scrape services, hours, pricing, FAQs, policies, locations, forms, tone, and CTAs before asking the owner.','High','Scrape the website and build Rose context',true],['Run context grader','Score the context and show what is safe to answer, risky to answer, or missing.','AI','Run a context grader and show missing info',true],['Generate missing questions','Turn website gaps into a short owner chat, not a long onboarding form.','AI','Ask me for missing context in chat',true],['Add pricing guardrails','Define exact prices, ranges, deposits, “starting at”, and when to forward.','Setup','Add pricing guardrails'],['Add policy answers','Refunds, cancellations, deposits, warranties, after-hours, delivery, parking, check-in.','Setup','Add policy answers'],['Add service areas','Teach Rose where the business serves and what areas are excluded.','Setup','Add service areas']]],['Lead routing', [['Route lead emails','Send every lead to the owner/team inbox with transcript and contact details.','Composio','Route lead emails to me'],['Phone alerts for hot leads','Text/call when visitors mention pricing, urgent help, booking, demo, or purchase intent.','Composio','Add phone number alerts for new leads',true],['Backup recipient','If owner misses a lead, forward to a second person automatically.','Setup','Add backup lead recipient'],['Route by service','Send sales, support, booking, and urgent requests to different people.','Setup','Route leads by service'],['After-hours routing','Change greeting, expectations, and alerts outside business hours.','Setup','Set after-hours lead routing'],['Lead scoring','Mark each lead hot/warm/cold with the reason Rose scored it that way.','AI','Add lead scoring']]],['Connections', [['Connect HubSpot','Push qualified Rose leads into HubSpot contacts and deals.','Composio','Connect HubSpot CRM',true],['Connect Pipedrive','Create people, organizations, deals, and notes from qualified Rose chats.','Composio','Connect Pipedrive CRM'],['Connect Salesforce','Create leads, contacts, and follow-up tasks in Salesforce.','Composio','Connect Salesforce CRM'],['Connect Airtable','Log leads and unanswered questions in an Airtable base.','Composio','Connect Airtable'],['Connect Google Sheets','Keep a simple lead log and unresolved-questions sheet.','Composio','Connect Google Sheets lead log'],['Connect Gmail','Send owner notifications and follow-ups from the business email account.','Composio','Connect Gmail for lead emails'],['Connect Google Calendar','Use booking rules and hand off to availability/calendar flows.','Composio','Connect Google Calendar'],['Connect Calendly','Route qualified visitors to the right scheduling link.','Composio','Connect Calendly'],['Connect Slack','Post hot leads and unresolved questions to the right internal channel.','Composio','Connect Slack alerts'],['Connect Zendesk','Create support tickets for complaints, refunds, and account issues.','Composio','Connect Zendesk support'],['Connect Twilio','Power SMS and phone alerts for hot leads.','Composio','Connect Twilio phone alerts']]],['Conversion upgrades', [['Add booking handoff','After Rose qualifies the visitor, send them to the correct booking link.','Growth','Add booking handoff'],['Add quote intake','Collect budget, timeline, service, location, photos, and notes before forwarding.','Growth','Add quote request intake'],['Add follow-up sequence','Automatically follow up with leads that chatted but did not book.','Growth','Add lead follow-up sequence'],['Add objection handling','Teach Rose answers for price, trust, timeline, competitors, financing, and guarantees.','Growth','Add objection handling'],['Add page-specific prompts','Pricing page, services page, and contact page should trigger different help.','AI','Add page specific prompts'],['Add exit save','If visitor is leaving, Rose offers help, booking, or a quick answer.','Growth','Add exit intent suggestion']]],['Voice + chat quality', [['Voice greeting','Set exact voice intro, business pronunciation, and escalation wording.','Voice','Add custom voice greeting'],['Test voice capture','Make sure Rose captures name, phone, email, need, and urgency correctly.','Test','Test voice lead capture'],['Tone tune','Make Rose premium, concise, friendly, clinical, luxury, or direct.','Brand','Change Rose tone'],['Do-not-say list','Block guarantees, legal/medical claims, exact availability, or unsupported promises.','Safety','Add do-not-say rules'],['Fallback response','When unsure, Rose should collect info and forward instead of guessing.','Safety','Set fallback response'],['Transcript summary','Summarize every lead with next step and urgency.','AI','Add transcript summary']]],['Tests before publish', [['Send test lead','Verify email/SMS/CRM routing before going live.','Test','Send test lead',true],['Run 10-question QA','Ask Rose common customer questions and score answer quality.','Test','Run ten question QA'],['Test unanswered popup','Confirm questions Rose cannot answer become Suggestions.','Test','Test unanswered customer request suggestion'],['Test CRM sync','Create one fake lead and verify it appears in the CRM.','Test','Test CRM delivery'],['Compare live vs draft','Show what changed before publishing.','Publish','Compare live and draft versions'],['Publish draft','Push the tested Rose configuration live.','Publish','Publish draft']]]];
      const rendered=groups.map(([name,items])=>`<section class="sug-group"><h3>${name}</h3><div class="leader-head"><span>Rank</span><span>App</span><span>Move</span><span>Impact</span></div>${items.map(i=>sug(...i)).join('')}</section>`).join('');
      return `<div class="page suggestions-page"><div class="page-head"><div><div class="page-kicker">Suggestions</div><h1>Launch checklist.</h1></div><div class="onboard-summary"><span class="pill on">72% ready</span><span class="pill">41 moves ranked</span><span class="pill">Composio ready</span></div></div><section class="launch-panel"><div class="launch-score"><div class="score-label">Launch readiness</div><div class="score-big">72%</div><p>Three launch blockers left.</p></div><div class="blockers"><b>Blocking before launch</b><div class="blocker"><i class="dot"></i>Lead email destination not connected</div><div class="blocker"><i class="dot"></i>Missing context answers from website gaps</div><div class="blocker"><i class="dot"></i>Test lead has not been delivered</div><div class="blocker"><i class="dot ok"></i>Unknown-answer fallback is enabled</div></div><div class="next-actions"><button class="primary" data-command="Scrape the website and build Rose context">Pull website context</button><button data-command="Run a context grader and show missing info">Run context grader</button><button data-command="Route lead emails to me">Connect Gmail</button><button data-command="Send test lead">Send test lead</button></div></section><div class="filters"><button class="filter active" data-filter-tab="All">All</button><button class="filter" data-filter-tab="Required">Required</button><button class="filter" data-filter-tab="Missing context">Missing context</button><button class="filter" data-filter-tab="Connections">Connections</button><button class="filter" data-filter-tab="Testing">Testing</button><button class="filter" data-filter-tab="Recommended">Recommended</button></div><div class="suggestions-board"><aside class="priority-rail"><div class="rail-card"><b>Next best actions</b><strong>72%</strong><span>Finish these before publishing.</span><ol><li>Pull website context</li><li>Grade missing context</li><li>Connect routing</li><li>Test before publish</li></ol></div>${dynamic}${queued}</aside><div class="suggestion-groups">${rendered}</div></div></div>`
    }
    function settingsHtml(){return `<div class="page settings-page"><div class="page-head"><div><div class="page-kicker">Settings</div><h1>Make Rose operational.</h1></div><p>Real routing controls, publish rules, and Composio-managed connections.</p></div><div class="page-grid"><div class="card"><h3>Lead delivery</h3><small>Where captured leads go first.</small><div class="row"><label>Owner email</label><input class="input" id="ownerEmail" value="${settings.ownerEmail}"></div><div class="row"><label>Backup email</label><input class="input" id="backupEmail" placeholder="optional" value="${settings.backupEmail}"></div><div class="row"><label>Phone alerts</label><input class="input" id="phone" placeholder="+1 555 000 0000" value="${settings.phone}"></div><button class="save" id="saveSettings" type="button">Save settings</button></div><div class="card"><h3>Connections</h3><small>Use Composio OAuth so Rose never stores raw app passwords.</small>${toggleHtml('email','Email via Gmail')}${toggleHtml('sms','Phone/SMS alerts')}${toggleHtml('crmEnabled','CRM sync')}${toggleHtml('calendar','Calendar handoff')}${toggleHtml('slack','Slack alerts')}<div class="row"><label>Preferred CRM</label><select class="select" id="crmSelect"><option>HubSpot</option><option>Pipedrive</option><option>Salesforce</option><option>Airtable</option><option>Google Sheets</option></select></div></div><div class="card"><h3>Answer boundaries</h3><small>When Rose cannot answer, it should create a Suggestion instead of guessing.</small>${toggleHtml('forwardUnknown','Forward unknown questions')}${toggleHtml('requireTests','Require tests before publish')}<div class="row"><label>Must-forward rules</label><textarea class="area" id="rules">${settings.rules}</textarea></div></div><div class="card"><h3>Current routing state</h3><small>Saved locally in this preview; production uses the Rose backend workspace.</small><div class="status" id="settingsStatus">${statusPills()}</div><button class="save" type="button" data-command="Test chat voice and lead routing">Run delivery test</button></div></div></div>`}
    function toggleHtml(key,label){return `<div class="toggle-row"><span>${label}</span><button class="toggle ${settings[key]?'on':''}" type="button" data-toggle="${key}" aria-label="${label}"></button></div>`}
    function statusPills(){return [`Email ${settings.email?'on':'off'}`,`SMS ${settings.sms?'on':'off'}`,`CRM ${settings.crmEnabled?settings.crm:'off'}`,`Calendar ${settings.calendar?'on':'off'}`,`Tests ${settings.requireTests?'required':'optional'}`].map((t,i)=>`<span class="pill ${/on|HubSpot|Pipedrive|Salesforce|Airtable|Sheets|required/.test(t)?'on':''}">${t}</span>`).join('')}
    function wirePage(){document.querySelectorAll('[data-command]').forEach(btn=>btn.addEventListener('click',()=>{showSection('Appearance');input.value=btn.dataset.command;input.focus();modeText.textContent='Ready'}));document.querySelectorAll('[data-toggle]').forEach(btn=>btn.addEventListener('click',()=>{const key=btn.dataset.toggle;settings[key]=!settings[key];btn.classList.toggle('on',settings[key]);const status=document.getElementById('settingsStatus');if(status)status.innerHTML=statusPills();notify(`${btn.previousElementSibling.textContent} ${settings[key]?'on':'off'}`)}));document.querySelectorAll('[data-filter-tab]').forEach(btn=>btn.addEventListener('click',()=>{const f=btn.dataset.filterTab;document.querySelectorAll('[data-filter-tab]').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.sug-card').forEach(card=>card.classList.toggle('hidden',f!=='All'&&card.dataset.filter!==f));notify(f==='All'?'Showing all suggestions':`Showing ${f}`)}));document.getElementById('saveSettings')?.addEventListener('click',()=>{settings.ownerEmail=document.getElementById('ownerEmail').value.trim();settings.backupEmail=document.getElementById('backupEmail').value.trim();settings.phone=document.getElementById('phone').value.trim();settings.crm=document.getElementById('crmSelect').value;settings.rules=document.getElementById('rules').value.trim();const status=document.getElementById('settingsStatus');if(status)status.innerHTML=statusPills();notify('Settings saved')});const crm=document.getElementById('crmSelect');if(crm)crm.value=settings.crm}
    function showSection(name){document.querySelectorAll('.section-tab').forEach(t=>t.classList.toggle('active',t.dataset.section===name));app.classList.toggle('page-mode',name!=='Appearance');messages.innerHTML=name==='Suggestions'?suggestionsHtml():name==='Settings'?settingsHtml():'<div class="empty" id="emptyState"><h1>What should Rose change?</h1></div>';messages.style.justifyContent=name==='Appearance'?'center':'flex-start';wirePage();modeText.textContent=name==='Appearance'?'Preview':name}
    form.addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(!value)return;add('user',value);input.value='';input.style.height='auto';modeText.textContent='Working';setTimeout(()=>add('assistant',run(value)),180)});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
    function publish(){draftChip.textContent='Published';notify(`Published ${state.name} · ${state.accentLabel}`);add('assistant',`Published preview version: ${state.name} · ${state.accentLabel}.`)}
    document.querySelectorAll('.section-tab').forEach(tab=>tab.addEventListener('click',()=>showSection(tab.dataset.section)));document.getElementById('publishTop').addEventListener('click',publish);window.addEventListener('load',()=>setTimeout(applyPreview,650));
  </script>
