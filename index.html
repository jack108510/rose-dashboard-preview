<body>
  <main class="shell" data-build="jack-blank-1">

      </section>

    </section>
  </main>
  <div class="toast" id="toast">Preview updated</div>
  <script src="/rose-dashboard-preview/wildrose-widget-sandbox-draft-runtime-1.js" data-api-base="https://wildrose-widget.wildeautomations.com" data-title="Rose" data-build="theme-controls-1" data-accent="#ff5722" data-mount="#rose-workground-widget" data-inline="true"></script>
  <script>
    const app=document.querySelector('.app'),messages=document.getElementById('messages'),form=document.getElementById('commandForm'),input=document.getElementById('commandInput'),modeText=document.getElementById('modeText'),toast=document.getElementById('toast'),draftChip=document.getElementById('draftChip'),contextMeta=document.getElementById('contextMeta');
    const accountTokenFromUrl=new URLSearchParams(location.search).get('token');
    if(accountTokenFromUrl){localStorage.setItem('roseDashboardToken',accountTokenFromUrl);try{history.replaceState(null,'',location.pathname)}catch{}}
    const savedClientSettings=JSON.parse(localStorage.getItem('roseClientSettings')||'{}');
    const state={name:'Rose',accent:'#ff5722',secondary:'#ffb49b',accentLabel:'Wildrose orange',description:'AI intake assistant',background:'#fffaf3',text:'#23130e',bubble:'rgba(255,255,255,.54)',button:'#ff5722',logoUrl:'',logoPrompt:''};
    const chatHistory=JSON.parse(localStorage.getItem('roseCommandHistory')||'[]'),savedContext=JSON.parse(localStorage.getItem('roseSavedContext')||'[]');
    const settings={businessName:savedClientSettings.businessName||'Company name',website:savedClientSettings.website||'company.com',ownerName:savedClientSettings.ownerName||'Owner name',ownerEmail:savedClientSettings.ownerEmail||'owner@company.com',backupEmail:savedClientSettings.backupEmail||'',phone:savedClientSettings.phone||'',knowledge:JSON.parse(localStorage.getItem('rosePreviewKnowledge')||'[]'),apiKeys:JSON.parse(localStorage.getItem('rosePreviewApiKeys')||'[]')};
    const flagged=JSON.parse(localStorage.getItem('roseDraftConnections')||'[]').filter(x=>x.kind==='flag').map(x=>x.label),connectionQueue=JSON.parse(localStorage.getItem('roseDraftConnections')||'[]').filter(x=>x.kind!=='flag').map(x=>x.provider),connectedConnections=JSON.parse(localStorage.getItem('roseConnectedConnections')||'[]'),pendingDocuments=[];
    let draftSaveTimer=null,lastDraftSavedAt='';
    const colors={blue:['#2563eb','blue'],cobalt:['#2563eb','blue'],navy:['#1d4ed8','navy'],green:['#2f6b45','moss green'],moss:['#2f6b45','moss green'],purple:['#7c3aed','purple'],plum:['#6d3a7a','plum'],gold:['#c8922a','gold'],orange:['#ff5722','Wildrose orange'],wildrose:['#ff5722','Wildrose orange'],red:['#e23b2e','red'],pink:['#d9468f','pink'],black:['#19130f','black'],yellow:['#facc15','yellow'],amber:['#f59e0b','amber'],white:['#ffffff','white'],cream:['#fffaf3','cream'],gray:['#6b7280','gray'],grey:['#6b7280','gray']};
    const connectorCopy={crm:['HubSpot / CRM','Create or update a contact from every qualified lead.'],email:['Gmail','Send owner lead emails and follow-up messages.'],calendar:['Google Calendar','Check booking rules and create follow-up events.'],phone:['SMS / phone alerts','Trigger instant hot-lead alerts through the phone connector.'],slack:['Slack','Post lead alerts into the right team channel.']};
    function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(window.__roseToast);window.__roseToast=setTimeout(()=>toast.classList.remove('show'),1300)}
    function saveCommandMemory(){localStorage.setItem('roseCommandHistory',JSON.stringify(chatHistory.slice(-12)));localStorage.setItem('roseSavedContext',JSON.stringify(savedContext.slice(-40)))}
    function esc(s){return String(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}
    function refreshContextStrip(){const notes=settings.knowledge.filter(n=>!n.revokedAt),conn=[...new Set(connectionQueue)].filter(Boolean);const chars=notes.reduce((n,x)=>n+String(x.text||'').length,0),kb=chars?Math.max(1,Math.ceil(chars/1024)):0;if(contextMeta){contextMeta.textContent=`${kb} KB ctx · ${conn.length} conn`;contextMeta.title=`${notes.length} context note${notes.length===1?'':'s'} · ${chars.toLocaleString()} characters · ${conn.length} connection${conn.length===1?'':'s'}`;contextMeta.onclick=()=>showSection('Settings')}}
    function readDocFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,text:String(reader.result||'').slice(0,12000)});reader.onerror=()=>reject(reader.error||new Error('Could not read file'));reader.readAsText(file)})}

    function roseCommandApi(){return new URLSearchParams(location.search).get('api')||localStorage.getItem('roseCommandApi')||'https://wildrose-widget.wildeautomations.com/api/rose/command'}
    function typeBubble(bubble,text){if(matchMedia('(prefers-reduced-motion: reduce)').matches){bubble.textContent=text;return}const tokens=String(text).match(/\S+\s*/g)||[''];let i=0;bubble.textContent='';bubble.classList.remove('thinking');bubble.classList.add('typing');const tick=()=>{bubble.textContent+=tokens.slice(i,i+2).join('');i+=2;messages.scrollTop=messages.scrollHeight;if(i<tokens.length)setTimeout(tick,18);else bubble.classList.remove('typing')};setTimeout(tick,60)}
    function makeTurn(role){document.querySelectorAll('.section-panel,.page').forEach(el=>el.remove());const empty=document.getElementById('emptyState');empty?.remove();const turn=document.createElement('div');turn.className=`turn ${role}`;const label=document.createElement('div');label.className='role';label.textContent=role==='user'?'You':'Builder';const bubble=document.createElement('div');bubble.className='bubble';turn.append(label,bubble);messages.appendChild(turn);messages.style.justifyContent='flex-start';messages.scrollTop=messages.scrollHeight;return bubble}
    function addThinking(){const bubble=makeTurn('assistant');bubble.classList.add('thinking');bubble.innerHTML='<span class="thinking-line"><span class="thinking-orb"></span><span>Thinking</span><span class="thinking-dots"><i></i><i></i><i></i></span></span>';return bubble}

    function add(role,text){const bubble=makeTurn(role);if(role==='assistant')typeBubble(bubble,text);else bubble.textContent=text}
    function soft(hex){const n=parseInt(hex.replace('#',''),16),mix=v=>Math.round(v+(255-v)*.55);return '#'+[mix((n>>16)&255),mix((n>>8)&255),mix(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('')}
    function readable(hex){const n=parseInt(hex.replace('#',''),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;return (r*299+g*587+b*114)/1000>150?'#18120f':'#f8fafc'}
    function colorHits(command){const found=[];for(const[name,[hex,label]]of Object.entries(colors)){if(new RegExp(`\\b${name}\\b`,'i').test(command)&&!found.find(x=>x.hex===hex))found.push({hex,label})}return found}
    function applyPreview(){const root=document.querySelector('#rose-workground-widget .wr-ai');if(!root)return setTimeout(applyPreview,100);const secondary=state.secondary||soft(state.accent);root.style.background='transparent';root.style.setProperty('--accent',state.accent);root.style.setProperty('--accent-soft',secondary);root.style.setProperty('--rose-bg',state.background);root.style.setProperty('--rose-text',state.text);root.style.setProperty('--rose-muted',state.text==='#f8fafc'?'rgba(248,250,252,.68)':'rgba(24,18,15,.58)');root.style.setProperty('--rose-bubble',state.bubble);root.style.setProperty('--rose-button',state.button||state.accent);root.style.setProperty('--sphere-a',state.accent);root.style.setProperty('--sphere-b',secondary);root.style.color=state.text;document.querySelectorAll('#rose-workground-widget .wr-title h3').forEach(el=>el.textContent=state.name);document.querySelectorAll('#rose-workground-widget .wr-title small').forEach(el=>el.textContent=state.description);document.querySelectorAll('#rose-workground-widget .wr-input').forEach(el=>{el.placeholder=`Ask ${state.name}…`;el.style.color=state.text});document.querySelectorAll('#rose-workground-widget button').forEach(el=>{if(el.textContent?.match(/Start talking|Send|Chat|Voice/)){el.style.borderColor=state.accent}});if(state.logoUrl){const head=document.querySelector('#rose-workground-widget .wr-title');if(head&&!head.querySelector('.logo-preview')){head.insertAdjacentHTML('afterbegin',`<span class="logo-preview"><img src="${state.logoUrl}" alt="${state.name} logo"></span>`)}const img=head?.querySelector('.logo-preview img');if(img)img.src=state.logoUrl}try{window.__roseWorkgroundApplyConfig?.(draftSnapshot())}catch{}modeText.textContent='Draft preview';}
    function isConnected(slug){return connectedConnections.includes(slug)}

    function saveDraftLocal(){localStorage.setItem('roseDraftConfig',JSON.stringify(draftSnapshot()));localStorage.setItem('roseDraftConnections',JSON.stringify([...connectionQueue.map(provider=>({provider})),...flagged.map(label=>({kind:'flag',label}))]));localStorage.setItem('roseConnectedConnections',JSON.stringify([...new Set(connectedConnections)]));draftChip.textContent=lastDraftSavedAt?'Draft saved':'Draft unsaved';refreshContextStrip()}

      const crmChooser=`<div class="sug-card crm-choice" data-filter="Connections" data-status="Connect app"><span class="rank-col">#01</span>${logoStack(['HubSpot','Pipedrive','Salesforce','Airtable','Google Sheets'])}<div class="sug-meta"><div class="sug-top"><b>Choose lead destination</b><span class="labels"><em class="tag hot">Composio</em><i class="option-count">${crmOptions.length+notifyOptions.length+supportOptions.length} options</i></span></div><span>Pick whatever they already use. CRM is optional — Rose can start with email/SMS, Sheets, Airtable, or a support desk.</span><div class="option-groups"><div><div class="option-label">CRM / lead database</div><div class="start-actions">${crmOptions.map(([l,c])=>optionBtn(l,c)).join('')}</div></div><div><div class="option-label">Notify team</div><div class="start-actions">${notifyOptions.map(([l,c])=>optionBtn(l,c)).join('')}</div></div><div><div class="option-label">Support desk</div><div class="start-actions">${supportOptions.map(([l,c])=>optionBtn(l,c)).join('')}</div></div></div></div><i class="status-chip connect">Choose app</i><strong class="score hot">98%</strong><span class="action-pill">Choose</span></div>`;
      const startRows=`<section class="sug-group"><div class="leader-head"><span>Rank</span><span>App</span><span>Move</span><span>Status</span><span>Impact</span><span></span></div>${crmChooser}${startHere.slice(1).map(i=>sug(...i)).join('')}</section>`;
      const optionalRows=optional.map(([name,items])=>`<section class="sug-group"><h3>${name}</h3><div class="leader-head"><span>Rank</span><span>App</span><span>Move</span><span>Status</span><span>Impact</span><span></span></div>${items.map(i=>sug(...i)).join('')}</section>`).join('');
      return `<div class="page suggestions-page"><div class="page-head"><div><div class="page-kicker">Suggestions</div><h1>Choose their tools.</h1><p class="start-note">Start with where leads should go. There are lots of options, but only one decision comes first.</p></div><div class="onboard-summary"><span class="pill on">21 app options</span><span class="pill">Composio ready</span></div></div><section class="launch-panel"><div class="launch-score"><div class="score-label">Launch readiness</div><div class="score-big">72%</div><div class="progress"><i></i></div><p>Connect routing before polishing answers.</p></div><div class="blockers"><div class="blocker"><i class="dot"></i>Lead destination not selected</div><div class="blocker"><i class="dot"></i>Lead email not connected</div><div class="blocker"><i class="dot"></i>Phone alerts not connected</div><div class="blocker"><i class="dot ok"></i>Fallback already enabled</div></div></section>${dynamic}${queued}<div class="queue-shell start-here"><div class="queue-title"><b>Start here</b><span>Pick a destination, then connect alerts and test</span></div><div class="suggestion-groups">${startRows}</div></div><details class="more-queue"><summary>Optional improvements after connections</summary><div class="queue-shell"><div class="suggestion-groups">${optionalRows}</div></div></details></div>`
    }
    function settingsHtml(){return `<div class="page settings-page"><div class="page-head"><div><div class="page-kicker">Settings</div><h1>Client information.</h1></div><p>Keep the client profile, approved business knowledge, and API keys clean.</p></div><div class="page-grid"><div class="card"><h3>Client info</h3><small>The basics Rose uses across the dashboard.</small><div class="row"><label>Business name</label><input class="input" id="businessName" value="${settings.businessName}"></div><div class="row"><label>Website</label><input class="input" id="website" value="${settings.website}"></div><div class="row"><label>Owner name</label><input class="input" id="ownerName" value="${settings.ownerName}"></div></div><div class="card"><h3>Contact details</h3><small>Where Wildrose and Rose should reach the client.</small><div class="row"><label>Owner email</label><input class="input" id="ownerEmail" value="${settings.ownerEmail}"></div><div class="row"><label>Backup email</label><input class="input" id="backupEmail" placeholder="optional" value="${settings.backupEmail}"></div><div class="row"><label>Phone</label><input class="input" id="phone" placeholder="+1 555 000 0000" value="${settings.phone}"></div><button class="save" id="saveSettings" type="button">Save client info</button></div><div class="card knowledge-card"><h3>Business knowledge</h3><small>Add random approved facts Rose should scan before answering. No labels required.</small><div class="knowledge-form"><textarea class="area" id="knowledgeText" placeholder="Example: Cabin 4 is pet friendly, but only for dogs under 40 lbs."></textarea><button class="save" id="addKnowledge" type="button">Add knowledge</button></div><div class="knowledge-list" id="knowledgeList">${knowledgeHtml()}</div><div class="settings-note">Rose searches these notes before answering. If no note covers the question, Rose should avoid guessing and offer follow-up.</div></div><div class="card api-key-card"><h3>API keys</h3><small>Create keys for approved tools or developers that need to call Rose. New keys are shown once.</small><div class="key-form"><input class="input" id="apiKeyName" placeholder="Key name, e.g. Website integration"><button class="save" id="createApiKey" type="button">Create key</button></div><div class="secret-box" id="apiSecretBox"></div><div class="key-list" id="apiKeyList">${apiKeysHtml()}</div><div class="settings-note">Keys are shown once. Store only prefix/last 4 in this preview; production stores hashed keys.</div></div></div></div>`}
    function roseAccountToken(){return new URLSearchParams(location.search).get('token')||localStorage.getItem('wildroseDashboardToken')||localStorage.getItem('roseDashboardToken')||''}
    function saveKnowledge(){localStorage.setItem('rosePreviewKnowledge',JSON.stringify(settings.knowledge));refreshContextStrip()}
    function knowledgeHtml(){const active=settings.knowledge.filter(n=>!n.revokedAt);return active.length?active.map(n=>`<div class="knowledge-row"><div><span>${(n.text||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</span><small>${n.source||'dashboard'} · ${new Date(n.createdAt).toLocaleDateString()}</small></div><div class="knowledge-actions"><button class="danger" type="button" data-delete-knowledge="${n.id}">Remove</button></div></div>`).join(''):'<small>No business knowledge yet.</small>'}
    function refreshKnowledge(){const list=document.getElementById('knowledgeList');if(list)list.innerHTML=knowledgeHtml();wireKnowledgeButtons()}
    async function syncKnowledge(action,payload={}){const token=roseAccountToken();if(!token)return null;const r=await fetch('https://wildrose-widget.wildeautomations.com/api/rose-account-knowledge',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Knowledge sync failed');return j}
    function applyConfigObject(cfg){if(!cfg)return;const a=cfg.appearance||{};state.name=a.assistantName||state.name;state.description=a.greetingMessage||state.description;state.accent=a.brandPrimary||state.accent;state.secondary=a.brandAccent||state.secondary;state.background=a.backgroundColor||state.background;state.text=a.textColor||state.text;state.bubble=a.bubbleColor||state.bubble;state.button=a.buttonColor||state.button;state.logoUrl=a.avatarUrl||state.logoUrl;state.logoPrompt=a.logoPrompt||state.logoPrompt;if(cfg.settings)Object.assign(settings,cfg.settings);if(Array.isArray(cfg.context)){settings.knowledge=cfg.context;saveKnowledge()}if(Array.isArray(cfg.connections)){connectionQueue.splice(0,connectionQueue.length,...cfg.connections.filter(c=>c.provider!=='context').map(c=>c.provider));flagged.splice(0,flagged.length,...cfg.connections.filter(c=>c.provider==='context').map(c=>c.label))}applyPreview();saveDraftLocal()}
    async function hydrateRoseAccount(){const token=roseAccountToken();if(!token)return;try{const r=await fetch('https://wildrose-widget.wildeautomations.com/api/rose-account-dashboard',{headers:{'Authorization':`Bearer ${token}`}});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||'Account sync failed');settings.businessName=j.customer?.businessName||settings.businessName;settings.website=j.customer?.website||settings.website;settings.ownerEmail=j.account?.email||settings.ownerEmail;localStorage.setItem('roseClientSettings',JSON.stringify({businessName:settings.businessName,website:settings.website,ownerEmail:settings.ownerEmail,ownerName:settings.ownerName,backupEmail:settings.backupEmail,phone:settings.phone}));if(j.draft||j.published){applyConfigObject(j.draft||j.published);lastDraftSavedAt=j.draft?.updatedAt||'';draftChip.textContent=j.draft?'Draft saved':'Published'}const k=await fetch('https://wildrose-widget.wildeautomations.com/api/rose-account-knowledge',{headers:{'Authorization':`Bearer ${token}`}}).then(x=>x.json()).catch(()=>null);if(k?.notes&&!j.draft){settings.knowledge=k.notes;saveKnowledge()}if(document.querySelector('.settings-page')){showSection('Settings')}notify('Account connected')}catch(err){console.error(err);notify('Account sync failed')}}
    function wireKnowledgeButtons(){document.querySelectorAll('[data-delete-knowledge]').forEach(btn=>btn.onclick=async()=>{const note=settings.knowledge.find(x=>x.id===btn.dataset.deleteKnowledge);if(note){note.revokedAt=new Date().toISOString();saveKnowledge();refreshKnowledge();notify('Knowledge removed');syncKnowledge('delete',{noteId:note.id}).catch(()=>{})}})}
    function saveApiKeys(){localStorage.setItem('rosePreviewApiKeys',JSON.stringify(settings.apiKeys))}
    function apiKeysHtml(){const active=settings.apiKeys.filter(k=>!k.revokedAt);return active.length?active.map(k=>`<div class="key-row"><div class="key-meta"><b>${k.name}</b><span>${k.prefix}…${k.last4} · created ${new Date(k.createdAt).toLocaleDateString()}</span></div><div class="key-actions"><button class="danger" type="button" data-revoke-key="${k.id}">Revoke</button></div></div>`).join(''):'<small>No API keys yet.</small>'}
    function makeApiSecret(){const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);return 'wr_'+Array.from(bytes,b=>b.toString(36).padStart(2,'0')).join('').slice(0,38)}
    function wireApiKeyButtons(){document.querySelectorAll('[data-revoke-key]').forEach(btn=>btn.onclick=()=>{const k=settings.apiKeys.find(x=>x.id===btn.dataset.revokeKey);if(k){k.revokedAt=new Date().toISOString();saveApiKeys();refreshApiKeys();notify('API key revoked')}})}
    function refreshApiKeys(){const list=document.getElementById('apiKeyList');if(list)list.innerHTML=apiKeysHtml();wireApiKeyButtons()}
    function toggleHtml(key,label){return `<div class="toggle-row"><span>${label}</span><button class="toggle ${settings[key]?'on':''}" type="button" data-toggle="${key}" aria-label="${label}"></button></div>`}
    function statusPills(){return [`Email ${settings.email?'on':'off'}`,`SMS ${settings.sms?'on':'off'}`,`CRM ${settings.crmEnabled?settings.crm:'off'}`,`Calendar ${settings.calendar?'on':'off'}`,`Tests ${settings.requireTests?'required':'optional'}`].map((t,i)=>`<span class="pill ${/on|HubSpot|Pipedrive|Salesforce|Airtable|Sheets|required/.test(t)?'on':''}">${t}</span>`).join('')}
    function wirePage(){document.querySelectorAll('[data-connect-tool]').forEach(btn=>{const meta=toolMeta(btn.dataset.connectTool);if(isConnected(meta.slug)){btn.disabled=true;btn.textContent='Connected'}btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(isConnected(meta.slug))return;startComposioConnect(meta,btn)})});document.querySelectorAll('[data-command]:not([data-connect-tool])').forEach(btn=>btn.addEventListener('click',()=>{showSection('Appearance');input.value=btn.dataset.command;input.focus();modeText.textContent='Ready'}));document.querySelectorAll('[data-toggle]').forEach(btn=>btn.addEventListener('click',()=>{const key=btn.dataset.toggle;settings[key]=!settings[key];btn.classList.toggle('on',settings[key]);const status=document.getElementById('settingsStatus');if(status)status.innerHTML=statusPills();notify(`${btn.previousElementSibling.textContent} ${settings[key]?'on':'off'}`);scheduleDraftSave()}));document.querySelectorAll('[data-filter-tab]').forEach(btn=>btn.addEventListener('click',()=>{const f=btn.dataset.filterTab;document.querySelectorAll('[data-filter-tab]').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.sug-card').forEach(card=>card.classList.toggle('hidden',f!=='All'&&card.dataset.filter!==f));notify(f==='All'?'Showing all suggestions':`Showing ${f}`)}));document.getElementById('saveSettings')?.addEventListener('click',()=>{settings.businessName=document.getElementById('businessName').value.trim();settings.website=document.getElementById('website').value.trim();settings.ownerName=document.getElementById('ownerName').value.trim();settings.ownerEmail=document.getElementById('ownerEmail').value.trim();settings.backupEmail=document.getElementById('backupEmail').value.trim();settings.phone=document.getElementById('phone').value.trim();notify('Client info saved');scheduleDraftSave()});document.getElementById('addKnowledge')?.addEventListener('click',async()=>{const text=(document.getElementById('knowledgeText')?.value||'').trim();if(!text){notify('Add a note first');return}let note={id:'ctx_'+Date.now().toString(36),text,source:'dashboard',createdAt:new Date().toISOString()};settings.knowledge.unshift(note);saveKnowledge();refreshKnowledge();document.getElementById('knowledgeText').value='';notify('Knowledge added');try{const j=await syncKnowledge('add',{text});if(j?.note){settings.knowledge=settings.knowledge.filter(n=>n.id!==note.id);settings.knowledge.unshift(j.note);saveKnowledge();refreshKnowledge();notify('Knowledge saved to draft');scheduleDraftSave()}}catch(err){notify('Saved in preview')}});wireKnowledgeButtons();document.getElementById('createApiKey')?.addEventListener('click',()=>{const name=(document.getElementById('apiKeyName')?.value||'Dashboard key').trim()||'Dashboard key',secret=makeApiSecret(),key={id:'rak_'+Date.now().toString(36),name,prefix:secret.slice(0,7),last4:secret.slice(-4),createdAt:new Date().toISOString()};settings.apiKeys.unshift(key);saveApiKeys();refreshApiKeys();const box=document.getElementById('apiSecretBox');if(box){box.classList.add('show');box.innerHTML=`<b>Copy this key now:</b><code>${secret}</code><button class="ghost" type="button" id="copyApiSecret">Copy key</button>`;document.getElementById('copyApiSecret')?.addEventListener('click',()=>{navigator.clipboard?.writeText(secret);notify('API key copied')})}document.getElementById('apiKeyName').value='';notify('API key created')});wireApiKeyButtons()}
    function showSection(name){document.querySelectorAll('.section-tab').forEach(t=>t.classList.toggle('active',t.dataset.section===name));app.classList.toggle('page-mode',name!=='Appearance');messages.innerHTML=name==='Suggestions'?suggestionsHtml():name==='Settings'?settingsHtml():'<div class="empty" id="emptyState"><h1>What should Rose change?</h1></div>';messages.style.justifyContent=name==='Appearance'?'center':'flex-start';wirePage();modeText.textContent=name==='Appearance'?'Draft preview':name}
    document.getElementById('attachDoc')?.addEventListener('click',()=>document.getElementById('docInput')?.click());document.getElementById('docInput')?.addEventListener('change',async e=>{await attachDocuments(e.target.files||[]);e.target.value=''});form.addEventListener('submit',async e=>{e.preventDefault();const value=input.value.trim();if(!value)return;if(/^\/queue\b/i.test(value)){input.value='';showSection('Suggestions');return}add('user',value);chatHistory.push({role:'user',content:value});saveCommandMemory();input.value='';input.style.height='auto';modeText.textContent='Thinking';const thinking=addThinking();try{const reply=await runRoseLlm(value);finishAssistant(thinking,reply)}catch(err){console.error(err);finishAssistant(thinking,'I could not process that command right now — try again in a moment.')} });input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
    async function publish(){draftChip.textContent='Publishing…';try{await saveDraftNow();const token=roseAccountToken();if(!token)throw new Error('Sign in first');const r=await fetch('https://wildrose-widget.wildeautomations.com/api/rose-account-draft',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({action:'publish',draft:draftSnapshot()})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||'Publish failed');draftChip.textContent='Published';notify(`Published ${state.name}`);add('assistant',`Published to the installed Rose widget. Appearance, context, and draft connections are now live.`)}catch(err){console.error(err);draftChip.textContent='Draft saved';notify(err.message||'Publish failed');add('assistant',`Could not publish yet: ${err.message||'publish failed'}`)}}
    window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='rose-composio-connected'||d.roseComposioConnected){markConnected(toolMeta(d.toolkit||d.tool||d.provider))}});document.querySelectorAll('.section-tab').forEach(tab=>tab.addEventListener('click',()=>showSection(tab.dataset.section)));document.getElementById('publishTop').addEventListener('click',publish);window.addEventListener('load',()=>{refreshContextStrip();setTimeout(applyPreview,650);hydrateRoseAccount()});
  </script>
