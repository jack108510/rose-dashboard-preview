<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4eee5" />
  <title>Rose Workground — Wildrose Automations</title>
  <style>
    :root {
      --paper: #f4eee5;
      --panel: rgba(255, 252, 246, .82);
      --panel-solid: #fffaf4;
      --ink: #17110e;
      --muted: #7a7067;
      --soft: #b3a79c;
      --line: rgba(28, 20, 16, .12);
      --line-strong: rgba(28, 20, 16, .2);
      --accent: #ff5722;
      --blue: #2563eb;
      --green: #2f6b45;
      --shadow: 0 28px 90px rgba(54, 35, 20, .14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 78% 20%, rgba(255, 87, 34, .11), transparent 32%),
        radial-gradient(circle at 18% 74%, rgba(35, 25, 19, .07), transparent 36%),
        linear-gradient(135deg, #f7f1e8, var(--paper));
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    button, textarea { font: inherit; }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(420px, 48vw) minmax(390px, 1fr);
      gap: clamp(28px, 5vw, 86px);
      padding: clamp(18px, 3vw, 42px);
      align-items: center;
    }

    /* Left side: the product surface is the LLM. Nothing else competes with it. */
    .llm {
      height: min(860px, calc(100vh - clamp(36px, 6vw, 84px)));
      min-height: 640px;
      border: 1px solid var(--line);
      border-radius: 34px;
      background: var(--panel);
      backdrop-filter: blur(28px) saturate(1.05);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      position: relative;
    }
    .llm:before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,.56), rgba(255,255,255,0) 38%);
    }
    .llm-top {
      position: relative;
      z-index: 1;
      height: 68px;
      padding: 0 18px 0 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: rgba(255, 252, 246, .46);
    }
    .identity { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .orb {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 26%, #fff 0 10%, #ffb196 18%, var(--accent) 58%, #9d2d12 100%);
      box-shadow: 0 0 0 8px rgba(255,87,34,.08), 0 12px 28px rgba(255,87,34,.18);
      flex: 0 0 auto;
    }
    .identity strong { display: block; font-size: 15px; letter-spacing: -.02em; }
    .identity span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .model-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #4d433b;
      background: rgba(255,255,255,.55);
      padding: 8px 11px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .model-pill i { width: 7px; height: 7px; border-radius: 50%; background: #28a66f; }
    .thread {
      position: relative;
      z-index: 1;
      overflow: auto;
      padding: 28px clamp(20px, 3vw, 34px);
      display: flex;
      flex-direction: column;
      gap: 22px;
      scroll-behavior: smooth;
    }
    .turn { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 13px; max-width: 94%; }
    .turn.user { align-self: flex-end; grid-template-columns: minmax(0, 1fr) 36px; }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      background: #18120f;
      box-shadow: 0 10px 28px rgba(24,18,15,.12);
    }
    .turn.assistant .avatar { background: linear-gradient(135deg, var(--accent), #ff9b77); }
    .body { display: grid; gap: 7px; }
    .turn.user .body { justify-items: end; }
    .name {
      color: #8a8077;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 780;
    }
    .bubble {
      width: fit-content;
      max-width: 100%;
      border-radius: 25px;
      padding: 15px 16px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .assistant .bubble {
      color: #28201b;
      background: rgba(255, 255, 255, .78);
      border: 1px solid rgba(28,20,16,.09);
      box-shadow: 0 8px 26px rgba(54,35,20,.055);
    }
    .user .bubble { color: #fff; background: #18120f; }

    .composer {
      position: relative;
      z-index: 1;
      padding: 0 clamp(16px, 2vw, 24px) clamp(16px, 2vw, 24px);
    }
    .input-shell {
      border: 1px solid var(--line-strong);
      border-radius: 28px;
      background: var(--panel-solid);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
      padding: 12px;
      box-shadow: 0 18px 48px rgba(54,35,20,.09);
    }
    textarea {
      width: 100%;
      min-height: 46px;
      max-height: 128px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      padding: 11px 8px;
      line-height: 1.42;
      font-size: 15px;
    }
    textarea::placeholder { color: #a39a91; }
    .send {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 18px;
      background: var(--ink);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(24,18,15,.22);
    }
    .hint {
      padding: 10px 9px 0;
      color: var(--soft);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .preview {
      min-height: 620px;
      display: grid;
      place-items: center;
      position: relative;
    }
    .preview:before {
      content: "";
      position: absolute;
      width: min(460px, 80%);
      height: min(460px, 80%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,87,34,.12), transparent 68%);
      filter: blur(18px);
      transform: translateY(20px);
      pointer-events: none;
    }
    .widget-slot {
      width: min(430px, 100%);
      min-height: 560px;
      position: relative;
      z-index: 1;
    }
    #rose-workground-widget { width: 100%; min-height: 560px; position: relative; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(16px);
      opacity: 0;
      pointer-events: none;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(24,18,15,.92);
      color: #fff;
      font-size: 13px;
      transition: .22s ease;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; align-items: start; }
      .llm { height: auto; min-height: 620px; }
      .preview { min-height: 610px; }
    }
    @media (max-width: 560px) {
      .app { padding: 14px; gap: 26px; }
      .llm { border-radius: 28px; min-height: 610px; }
      .llm-top { height: auto; min-height: 66px; align-items: flex-start; padding: 16px; flex-direction: column; }
      .thread { padding: 22px 16px; }
      .turn { max-width: 100%; }
      .model-pill { align-self: flex-start; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="llm" aria-label="Rose LLM workbench">
      <div class="llm-top">
        <div class="identity">
          <span class="orb"></span>
          <div><strong>Rose Builder</strong><span>Natural-language config workspace</span></div>
        </div>
        <span class="model-pill"><i></i>Preview agent</span>
      </div>

      <div class="thread" id="messages">
        <div class="turn assistant">
          <div class="avatar">R</div>
          <div class="body">
            <div class="name">Rose Builder</div>
            <div class="bubble">Tell me what you want changed on the website assistant. I’ll edit the preview first, then the same config can be published to the live widget.</div>
          </div>
        </div>
      </div>

      <form class="composer" id="commandForm">
        <div class="input-shell">
          <textarea id="commandInput" rows="1" placeholder="Message Rose Builder…"></textarea>
          <button class="send" aria-label="Send command" type="submit">→</button>
        </div>
        <div class="hint"><span>Enter to send · Shift Enter for new line</span><span id="modeText">Preview only</span></div>
      </form>
    </section>

    <aside class="preview" aria-label="Live Rose website preview">
      <div class="widget-slot">
        <div id="rose-workground-widget" aria-label="Rose widget workground"></div>
      </div>
    </aside>
  </main>
  <div class="toast" id="toast">Preview updated</div>

  <script
    src="/rose-dashboard-preview/wildrose-widget-sandbox.js?v=workground-rose-1"
    data-api-base="https://wildrose-widget.wildeautomations.com"
    data-title="Rose"
    data-accent="#ff5722"
    data-mount="#rose-workground-widget"
    data-inline="true"
  ></script>
  <script>
    const messages = document.getElementById('messages');
    const form = document.getElementById('commandForm');
    const input = document.getElementById('commandInput');
    const modeText = document.getElementById('modeText');
    const toast = document.getElementById('toast');

    const state = { name: 'Rose', accent: '#ff5722', accentLabel: 'Wildrose orange', description: 'AI intake assistant' };
    const colors = {
      blue: ['#2563eb', 'blue'], cobalt: ['#2563eb', 'blue'], navy: ['#1d4ed8', 'navy'],
      green: ['#2f6b45', 'moss green'], moss: ['#2f6b45', 'moss green'],
      purple: ['#7c3aed', 'purple'], plum: ['#6d3a7a', 'plum'],
      gold: ['#c8922a', 'gold'], orange: ['#ff5722', 'Wildrose orange'], wildrose: ['#ff5722', 'Wildrose orange'],
      red: ['#e23b2e', 'red'], pink: ['#d9468f', 'pink'], black: ['#17110e', 'black']
    };
    function add(role, text) {
      const turn = document.createElement('div');
      turn.className = `turn ${role}`;
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? 'J' : 'R';
      const body = document.createElement('div');
      body.className = 'body';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = role === 'user' ? 'You' : 'Rose Builder';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      body.append(name, bubble);
      role === 'user' ? turn.append(body, avatar) : turn.append(avatar, body);
      messages.appendChild(turn);
      messages.scrollTop = messages.scrollHeight;
    }
    function soft(hex) {
      const n = parseInt(hex.replace('#',''), 16);
      const mix = v => Math.round(v + (255 - v) * .55);
      return '#' + [mix((n >> 16) & 255), mix((n >> 8) & 255), mix(n & 255)].map(v => v.toString(16).padStart(2,'0')).join('');
    }
    function applyPreview() {
      const root = document.querySelector('#rose-workground-widget .wr-ai');
      if (!root) return setTimeout(applyPreview, 100);
      root.style.setProperty('--accent', state.accent);
      root.style.setProperty('--accent-soft', soft(state.accent));
      document.querySelectorAll('#rose-workground-widget .wr-title h3').forEach(el => el.textContent = state.name);
      document.querySelectorAll('#rose-workground-widget .wr-title small').forEach(el => el.textContent = state.description);
      document.querySelectorAll('#rose-workground-widget .wr-input').forEach(el => el.placeholder = `Ask ${state.name}…`);
      modeText.textContent = 'Preview updated';
      toast.classList.add('show');
      clearTimeout(window.__roseToast);
      window.__roseToast = setTimeout(() => toast.classList.remove('show'), 1100);
    }
    function parseName(command) {
      const patterns = [
        /(?:call|rename|name)\s+(?:the\s+)?(?:assistant|agent|widget|rose)?\s*(?:to\s+)?([a-z][a-z\s'-]{1,24})/i,
        /(?:make\s+(?:it|her|him)\s+called)\s+([a-z][a-z\s'-]{1,24})/i
      ];
      for (const p of patterns) {
        const m = command.match(p);
        if (m) return m[1].trim().replace(/\s+/g, ' ').replace(/\b\w/g, x => x.toUpperCase());
      }
      return null;
    }
    function run(command) {
      const c = command.toLowerCase();
      const changes = [];
      for (const [name, [hex, label]] of Object.entries(colors)) {
        if (c.includes(name)) { state.accent = hex; state.accentLabel = label; changes.push(`Accent set to ${label}.`); break; }
      }
      const newName = parseName(command);
      if (newName && !/color|colour|crm|hubspot|connect|tone/.test(newName.toLowerCase())) { state.name = newName; changes.push(`Assistant renamed to ${newName}.`); }
      if (c.includes('premium') || c.includes('luxury') || c.includes('cleaner')) { state.description = 'Premium website concierge'; changes.push('Tone tightened to premium.'); }
      if (c.includes('friendly') || c.includes('warmer')) { state.description = 'Warm website concierge'; changes.push('Tone made warmer.'); }
      if (changes.length) { applyPreview(); return `${changes.join(' ')}\n\nPreview updated. Publishing would save this same config to the live install.`; }
      if (c.includes('crm') || c.includes('hubspot') || c.includes('salesforce') || c.includes('pipedrive')) return 'I’d open the secure Connections flow, authorize the CRM through Composio, then run one test lead before marking it live.';
      if (c.includes('calendar') || c.includes('booking')) return 'I’d connect the calendar/booking source, set exact confirmation boundaries, then test Rose so it never invents availability.';
      if (c.includes('lead') || c.includes('email')) return 'Send the destination email and I’d update lead routing, submit one test lead, and verify delivery before publishing.';
      return 'Got it. I’d turn that into a concrete Rose config change, preview it here, test chat/voice/lead behavior, then publish it to the installed website.';
    }
    form.addEventListener('submit', e => {
      e.preventDefault();
      const value = input.value.trim();
      if (!value) return;
      add('user', value);
      input.value = '';
      input.style.height = 'auto';
      modeText.textContent = 'Working';
      setTimeout(() => add('assistant', run(value)), 220);
    });
    input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 128) + 'px'; });
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
    window.addEventListener('load', () => setTimeout(applyPreview, 650));
  </script>
</body>
</html>
