<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rose Account Login</title>
  <style>
    :root{--paper:#f6f0e8;--surface:#fffaf3;--ink:#19130f;--muted:#746a61;--line:rgba(25,19,15,.12);--accent:#ff5722}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 25% 20%,rgba(255,87,34,.13),transparent 30%),var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px}
    form{width:min(430px,100%);border:1px solid var(--line);border-radius:28px;background:rgba(255,250,243,.82);box-shadow:0 28px 90px rgba(54,35,20,.14);padding:28px;display:grid;gap:15px}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.brand i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff 0 12%,#ffb49b 20%,var(--accent) 62%,#9a2b12)}h1{font-family:ui-serif,Georgia,"Times New Roman",serif;margin:10px 0 0;font-size:48px;line-height:.96;letter-spacing:-.06em;font-weight:520}p{margin:0;color:var(--muted);line-height:1.5}label{display:grid;gap:7px;font-size:12px;font-weight:800;color:#6f645b}input{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);padding:13px 14px;font:inherit}button{height:44px;border:0;border-radius:999px;background:var(--ink);color:white;font-weight:820;cursor:pointer}.msg{min-height:20px;font-size:13px;color:var(--muted)}.error{color:#b3261e}
  </style>
</head>
<body>
  <form id="loginForm">
    <div class="brand"><i></i><span>Rose</span></div>
    <h1>Sign in.</h1>
    <p>Use the Wildrose account credentials for this Rose test workspace.</p>
    <label>Email<input id="email" type="email" autocomplete="email" value="wildejack1010@gmail.com" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Open dashboard</button>
    <div class="msg" id="msg"></div>
  </form>
  <script>
    const form=document.getElementById('loginForm'),msg=document.getElementById('msg');
    form.addEventListener('submit',async e=>{
      e.preventDefault();msg.className='msg';msg.textContent='Signing in…';
      try{
        const r=await fetch('https://wildrose-widget.wildeautomations.com/api/rose-account-login',{method:'POST',headers:{'Content-Type':'application/json','bypass-tunnel-reminder':'1'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});
        const j=await r.json().catch(()=>({}));
        if(!r.ok||!j.token)throw new Error(j.error||'Login failed');
        localStorage.setItem('roseDashboardToken',j.token);
        localStorage.setItem('wildroseDashboardToken',j.token);
        localStorage.setItem('roseClientSettings',JSON.stringify({businessName:j.customer?.businessName||'Jack Rose Test',website:j.customer?.website||'',ownerEmail:j.account?.email||document.getElementById('email').value.trim(),ownerName:'Jack Wilde'}));
        location.href='index.html';
      }catch(err){msg.className='msg error';msg.textContent=err.message||'Login failed';}
    });
  </script>
</body>
</html>
